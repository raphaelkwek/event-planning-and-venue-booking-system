# A2 for venue booking requests and holds. Unlisted combinations must be denied.
name: BookingRequestTestSuite
description: Who may act on a booking request or hold (A2), derived from L1, L2, L3, M1, M2, N2 and A3.
tests:
  - name: Every role against a booking request
    input:
      principals: [organiser, other_organiser, assigned_coordinator, other_coordinator, nominee, venue_manager, other_venue_staff, tech_support, attendee, other_attendee]
      resources: [booking_hall]
      actions: [create, withdraw, request_hold, convert_hold, place_hold, release_hold, view, list, view_queue, approve, reject, view_conflicts]
    expected:
      - principal: organiser # L1, L2, L3: the owner lists the event's venue requests and holds
        resource: booking_hall
        actions: { list: EFFECT_ALLOW }
      - principal: assigned_coordinator # L1, L2, L3, A4: only the assigned coordinator requests, converts, releases and sees
        resource: booking_hall
        actions: { create: EFFECT_ALLOW, withdraw: EFFECT_ALLOW, request_hold: EFFECT_ALLOW, convert_hold: EFFECT_ALLOW, release_hold: EFFECT_ALLOW, view: EFFECT_ALLOW, list: EFFECT_ALLOW }
      # other_coordinator, nominee: none. A4: not their event, so they don't see it either.
      - principal: venue_manager # M1, M2, N2: staff of this venue decide; L3 (Week 9 answer): they place holds
        resource: booking_hall
        actions: { view: EFFECT_ALLOW, approve: EFFECT_ALLOW, reject: EFFECT_ALLOW, view_conflicts: EFFECT_ALLOW, place_hold: EFFECT_ALLOW, view_queue: EFFECT_ALLOW }
      - principal: other_venue_staff # A3: their queue holds only their own venues' rows, so they may open it
        resource: booking_hall
        actions: { view_queue: EFFECT_ALLOW }
      # other_venue_staff otherwise: none, A3 limits Venue Staff to their own venues.
      # Organisers, Tech Support and Attendees: none.
