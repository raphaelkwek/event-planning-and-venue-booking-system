# A2 for events: every role against every action. Only the allows are listed;
# every combination not listed must be denied. Each allow cites its story.
name: EventTestSuite
description: Who may act on an event request (A2), derived from the stories.
tests:
  - name: Every role against an event open for registration
    input:
      principals: [organiser, other_organiser, assigned_coordinator, other_coordinator, nominee, venue_manager, other_venue_staff, tech_support, attendee, other_attendee, lead]
      resources: [event_open]
      actions: [create, view_draft, update_draft, submit_draft, view, view_history, view_clarifications, view_reassignments, review, request_clarification, approve, reject, respond_to_clarification, propose_reassignment, respond_to_reassignment, cancel, confirm, decide_change, update_details, preview_change_impact, reconsider_arrangements, request_change, assign, reassign, view_assignments]
    expected:
      - principal: organiser # the owner
        resource: event_open
        actions:
          create: EFFECT_ALLOW # B1, C1
          view_draft: EFFECT_ALLOW # C2: the draft editor opens the draft
          update_draft: EFFECT_ALLOW # C2
          submit_draft: EFFECT_ALLOW # C2
          view: EFFECT_ALLOW # C3
          view_history: EFFECT_ALLOW # F2
          view_clarifications: EFFECT_ALLOW # D3
          respond_to_clarification: EFFECT_ALLOW # D3
          cancel: EFFECT_ALLOW # F3
          update_details: EFFECT_ALLOW # G1
          request_change: EFFECT_ALLOW # S1
          preview_change_impact: EFFECT_ALLOW # G2: the owner sees a change request's impact, as the request
      - principal: other_organiser # C2, D3, A3: no access to someone else's request
        resource: event_open
        actions:
          create: EFFECT_ALLOW # B1: may still create their own
      - principal: assigned_coordinator
        resource: event_open
        actions:
          view: EFFECT_ALLOW # D1, A4: a coordinator sees the events assigned to them
          view_history: EFFECT_ALLOW # F2
          view_clarifications: EFFECT_ALLOW # D2
          view_reassignments: EFFECT_ALLOW # E2
          review: EFFECT_ALLOW # D1
          request_clarification: EFFECT_ALLOW # D2
          approve: EFFECT_ALLOW # D4
          reject: EFFECT_ALLOW # D5
          cancel: EFFECT_ALLOW # F3
          confirm: EFFECT_ALLOW # F5
          decide_change: EFFECT_ALLOW # S2
          update_details: EFFECT_ALLOW # G1
          preview_change_impact: EFFECT_ALLOW # G2
          reconsider_arrangements: EFFECT_ALLOW # S3
          propose_reassignment: EFFECT_ALLOW # E2, retired by E4: the route tells every coordinator so
      # other_coordinator: only the retired proposal route. A4 (CR-05): a coordinator neither
      # sees nor acts on an event not assigned to them (A3's "coordinators see all events" is superseded).
      - principal: other_coordinator
        resource: event_open
        actions:
          propose_reassignment: EFFECT_ALLOW # E2, retired by E4: answered 410 by the route
      - principal: nominee # another coordinator, named by a proposal made before E4
        resource: event_open
        actions:
          respond_to_reassignment: EFFECT_ALLOW # E2: the nominee accepts or declines, and nothing else (A4)
          propose_reassignment: EFFECT_ALLOW # E2, retired by E4: answered 410 by the route
      - principal: venue_manager # A3: rows limited by RLS, not here
        resource: event_open
        actions:
          view: EFFECT_ALLOW
      - principal: other_venue_staff
        resource: event_open
        actions:
          view: EFFECT_ALLOW
      - principal: tech_support
        resource: event_open
        actions:
          view: EFFECT_ALLOW
      - principal: attendee # R1: published events open for registration
        resource: event_open
        actions:
          view: EFFECT_ALLOW
      - principal: other_attendee
        resource: event_open
        actions:
          view: EFFECT_ALLOW
      - principal: lead # E3: the Lead opens a request and assigns it, and acts on nothing else
        resource: event_open
        actions:
          view: EFFECT_ALLOW # E3, E5
          assign: EFFECT_ALLOW # E3
          reassign: EFFECT_ALLOW # E4: the only route to a reassignment (W9-59)
          view_assignments: EFFECT_ALLOW # E5: the overview and each event's assignment history

  - name: Attendees can't open an event that isn't open for registration (R1, A3)
    input:
      principals: [attendee, other_attendee]
      resources: [event_not_open]
      actions: [view, view_history]
    expected: # Cerbos needs at least one expectation, so the denials are spelled out
      - principal: attendee
        resource: event_not_open
        actions: { view: EFFECT_DENY, view_history: EFFECT_DENY }
      - principal: other_attendee
        resource: event_not_open
        actions: { view: EFFECT_DENY, view_history: EFFECT_DENY }
