# Who may do what to a venue and its calendar (A2). Rule names cite the story.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: venue
  importDerivedRoles: [connectsphere]
  rules:
    - name: H1-only-venue-staff-add-venues
      actions: [create]
      effect: EFFECT_ALLOW
      roles: [VENUE_STAFF]

    # H1, H3: Venue Staff update only the venues they look after; another venue is
    # "not found" to them (A3).
    - name: H1-H3-the-venue-s-staff-maintain-it
      actions: [update, deactivate]
      effect: EFFECT_ALLOW
      derivedRoles: [venue_manager]

    # H1: the other internal roles have read access only. H2, I1: attendees
    # have no access to the catalogue or the calendar.
    - name: H1-H2-I1-internal-roles-read
      actions: [view, view_calendar]
      effect: EFFECT_ALLOW
      roles: [EVENT_ORGANISER, EVENT_COORDINATOR, VENUE_STAFF, TECH_SUPPORT_STAFF]

    # I2: only the venue's own Venue Staff see, record and remove its unavailability.
    - name: I2-the-venue-s-staff-record-unavailability
      actions: [view_unavailability, record_unavailability, remove_unavailability]
      effect: EFFECT_ALLOW
      derivedRoles: [venue_manager]

    - name: J1-J2-K1-K2-coordinators-search-and-assess
      actions: [search, check_suitability, justify_unsuitable]
      effect: EFFECT_ALLOW
      roles: [EVENT_COORDINATOR]
