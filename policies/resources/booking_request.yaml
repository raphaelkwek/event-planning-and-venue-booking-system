# Who may do what to a venue booking request or hold (A2). Rule names cite the story.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: booking_request
  importDerivedRoles: [connectsphere]
  rules:
    # A4: the event's assigned coordinator, and nobody else, books, holds and releases
    # for it. After a reassignment that is the new coordinator, whoever held the slot.
    - name: L1-L2-L3-A4-only-the-assigned-coordinator-books
      actions: [create, withdraw, request_hold, convert_hold, release_hold, view]
      effect: EFFECT_ALLOW
      derivedRoles: [assigned_coordinator]

    # L3, Week 9 answer (CQ-06): the coordinator requests a hold, and Venue Staff
    # of the venue place it, setting its expiry.
    - name: L3-venue-staff-place-holds-on-their-venues
      actions: [place_hold]
      effect: EFFECT_ALLOW
      derivedRoles: [venue_manager]

    - name: A3-M1-M2-N2-venue-staff-act-on-their-venues
      actions: [view, approve, reject, view_conflicts]
      effect: EFFECT_ALLOW
      derivedRoles: [venue_manager]
