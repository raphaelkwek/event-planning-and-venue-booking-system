# Who may do what to an event request (A2). Rule names cite the story.
# Status rules ("not once Completed") live in the event module's domain code,
# not here: Cerbos answers who, the domain answers when.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: event
  importDerivedRoles: [connectsphere]
  rules:
    - name: B1-C1-create-a-request
      actions: [create]
      effect: EFFECT_ALLOW
      roles: [EVENT_ORGANISER]

    # C2: the draft editor opens (view_draft), saves and submits the owner's draft.
    - name: C2-open-edit-and-submit-my-draft
      actions: [view_draft, update_draft, submit_draft]
      effect: EFFECT_ALLOW
      derivedRoles: [owner]

    # Which rows each role sees is A3's job, enforced by row-level security
    # (EN-07.2). This rule only says which roles may open an event at all. The
    # Safety Officer's scope holds no event (U1 reads the review instead), as
    # Venue Staff's and Technical Support's hold none through this route.
    - name: C3-F2-U1-view-as-staff
      actions: [view]
      effect: EFFECT_ALLOW
      roles: [VENUE_STAFF, TECH_SUPPORT_STAFF, SAFETY_OFFICER]

    # A4 (CR-05): a coordinator opens only the events assigned to them. Whether
    # they may view others read-only is CQ-11; until it is answered, they may not.
    - name: A4-D1-F2-the-assigned-coordinator-views
      actions: [view]
      effect: EFFECT_ALLOW
      derivedRoles: [assigned_coordinator]

    - name: C3-F2-view-my-own-request
      actions: [view]
      effect: EFFECT_ALLOW
      derivedRoles: [owner]

    - name: R1-attendees-view-events-open-for-registration
      actions: [view]
      effect: EFFECT_ALLOW
      roles: [ATTENDEE]
      condition:
        match:
          expr: request.resource.attr.registrationOpen == true

    - name: F2-history-for-the-owner
      actions: [view_history, view_clarifications]
      effect: EFFECT_ALLOW
      derivedRoles: [owner]

    - name: A4-F2-D2-history-for-the-assigned-coordinator
      actions: [view_history, view_clarifications, view_reassignments]
      effect: EFFECT_ALLOW
      derivedRoles: [assigned_coordinator]

    # A4: only the assigned coordinator reviews and decides (D1 to D5).
    - name: A4-D1-D2-D4-D5-the-assigned-coordinator-reviews-and-decides
      actions: [review, request_clarification, approve, reject]
      effect: EFFECT_ALLOW
      derivedRoles: [assigned_coordinator]

    - name: D3-answer-a-clarification
      actions: [respond_to_clarification]
      effect: EFFECT_ALLOW
      derivedRoles: [owner]

    # E3, E5 (CR-05): the Lead opens any event to assign and oversee it, and
    # coordinates none (W9-35).
    - name: E3-E5-the-lead-views-every-event-and-its-assignments
      actions: [view, view_assignments]
      effect: EFFECT_ALLOW
      roles: [EVENT_COORDINATOR_LEAD]

    # E4 (W9-59): the Lead is the only route to a reassignment; E2's proposals are retired.
    - name: E3-E4-only-the-lead-assigns-and-reassigns
      actions: [assign, reassign]
      effect: EFFECT_ALLOW
      roles: [EVENT_COORDINATOR_LEAD]

    # E2's proposal route is retired (E4, W9-59): every coordinator who calls it is
    # told so (410 REASSIGNMENT_RETIRED). Cerbos lets coordinators reach it; the domain
    # answers "no longer". The Lead reassigns instead.
    - name: E2-coordinators-reach-the-retired-proposal-route
      actions: [propose_reassignment]
      effect: EFFECT_ALLOW
      roles: [EVENT_COORDINATOR]

    # U1 (CR-06): only the Safety Officer reads the safety queue and review and records the
    # decision (A2). Mark Confirmed belongs to the event's assigned coordinator (W9-31).
    - name: U1-the-safety-officer-reviews-and-decides
      actions: [view_safety_queue, view_safety_review, decide_safety]
      effect: EFFECT_ALLOW
      roles: [SAFETY_OFFICER]

    - name: U1-assigned-coordinator-marks-confirmed
      actions: [mark_confirmed]
      effect: EFFECT_ALLOW
      derivedRoles: [assigned_coordinator]

    - name: E2-only-the-nominee-accepts-or-declines
      actions: [respond_to_reassignment]
      effect: EFFECT_ALLOW
      derivedRoles: [nominated_coordinator]

    - name: F3-owner-or-assigned-coordinator-cancels
      actions: [cancel]
      effect: EFFECT_ALLOW
      derivedRoles: [owner, assigned_coordinator]

    - name: F5-S2-assigned-coordinator-confirms-and-decides-changes
      actions: [confirm, decide_change]
      effect: EFFECT_ALLOW
      derivedRoles: [assigned_coordinator]

    - name: G1-owner-or-assigned-coordinator-edits-details
      actions: [update_details]
      effect: EFFECT_ALLOW
      derivedRoles: [owner, assigned_coordinator]

    # G2: the owner and the assigned coordinator see a change request's impact, as they see the
    # request itself (S1). S3: only the assigned coordinator reconsiders the arrangements (A4).
    - name: G2-the-owner-and-assigned-coordinator-preview-change-impact
      actions: [preview_change_impact]
      effect: EFFECT_ALLOW
      derivedRoles: [owner, assigned_coordinator]

    - name: A4-S3-the-assigned-coordinator-reconsiders-arrangements
      actions: [reconsider_arrangements]
      effect: EFFECT_ALLOW
      derivedRoles: [assigned_coordinator]

    # R2, R4, EN-19: the owning organiser sets the registration window, the withdrawal deadline
    # and whether the event is high-demand (attendees queue in the waiting room).
    - name: R2-R4-the-owner-configures-registration
      actions: [configure_registration]
      effect: EFFECT_ALLOW
      derivedRoles: [owner]

    - name: S1-owner-requests-a-change
      actions: [request_change]
      effect: EFFECT_ALLOW
      derivedRoles: [owner]
