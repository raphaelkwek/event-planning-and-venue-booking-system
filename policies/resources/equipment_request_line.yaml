# Who may do what to one line of an event's equipment request (A2). Rule names cite the story.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: equipment_request_line
  importDerivedRoles: [connectsphere]
  rules:
    # A4: only the assigned coordinator records equipment for an event, or sees its lines.
    - name: O1-A4-the-assigned-coordinator-records-equipment
      actions: [create, update, remove, view]
      effect: EFFECT_ALLOW
      derivedRoles: [assigned_coordinator]

    - name: A3-tech-support-see-requests
      actions: [view]
      effect: EFFECT_ALLOW
      roles: [TECH_SUPPORT_STAFF]

    - name: O2-P1-Q1-Q2-tech-support-arrange-equipment
      actions: [update_status, check_availability, reserve, release]
      effect: EFFECT_ALLOW
      roles: [TECH_SUPPORT_STAFF]
