      - eval_time: 65m
        alertname: StaffApiLatencyBurnFast
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: staff_api_latency
            exp_annotations:
              summary: "Staff API requests slower than their objective (reads 400 ms, writes 800 ms): the staff api latency error budget is burning at 14.4x or more."
