              sum(rate(http_request_duration_seconds_bucket{service="planning-core",route!~"/healthz|/readyz|/metrics|unmatched",method=~"GET|HEAD",le="0.4"}[1h]))
              +
              sum(rate(http_request_duration_seconds_bucket{service="planning-core",route!~"/healthz|/readyz|/metrics|unmatched",method!~"GET|HEAD",le="0.8"}[1h]))
            )
            /
            sum(rate(http_request_duration_seconds_count{service="planning-core",route!~"/healthz|/readyz|/metrics|unmatched"}[1h]))
          )
      - record: sli:staff_api_latency_slow:ratio_rate6h
        expr: |
          1 - (
            (
              sum(rate(http_request_duration_seconds_bucket{service="planning-core",route!~"/healthz|/readyz|/metrics|unmatched",method=~"GET|HEAD",le="0.4"}[6h]))
              +
              sum(rate(http_request_duration_seconds_bucket{service="planning-core",route!~"/healthz|/readyz|/metrics|unmatched",method!~"GET|HEAD",le="0.8"}[6h]))
            )
            /
            sum(rate(http_request_duration_seconds_count{service="planning-core",route!~"/healthz|/readyz|/metrics|unmatched"}[6h]))
          )
  - name: sli_notification_freshness
    rules:
      - record: sli:notification_freshness_late:ratio_rate5m
        expr: |
          1 - (
            sum(rate(notification_visibility_lag_seconds_bucket{service="notification",le="10"}[5m]))
            /
            sum(rate(notification_visibility_lag_seconds_count{service="notification"}[5m]))
          )
      - record: sli:notification_freshness_late:ratio_rate30m
