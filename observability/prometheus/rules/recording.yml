  - name: sli_availability
    rules:
      - record: sli:availability_errors:ratio_rate5m
        expr: |
          sum by (service) (rate(http_requests_total{route!~"/healthz|/readyz|/metrics|unmatched",status="5xx"}[5m]))
          /
          sum by (service) (rate(http_requests_total{route!~"/healthz|/readyz|/metrics|unmatched"}[5m]))
      - record: sli:availability_errors:ratio_rate30m
        expr: |
          sum by (service) (rate(http_requests_total{route!~"/healthz|/readyz|/metrics|unmatched",status="5xx"}[30m]))
          /
          sum by (service) (rate(http_requests_total{route!~"/healthz|/readyz|/metrics|unmatched"}[30m]))
      - record: sli:availability_errors:ratio_rate1h
        expr: |
          sum by (service) (rate(http_requests_total{route!~"/healthz|/readyz|/metrics|unmatched",status="5xx"}[1h]))
