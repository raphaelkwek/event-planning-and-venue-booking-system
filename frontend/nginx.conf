# EN-10. Serves the built web app. Runs unprivileged on 8080 with a read-only
# root filesystem in Kubernetes; nginx-unprivileged keeps its temp files in /tmp.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Liveness and readiness probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints everything under /assets, so it can be cached for good.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Single-page app: an unknown path is a client-side route, so serve index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }
}
