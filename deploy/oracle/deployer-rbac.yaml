# ADR-0016. What the deploy gate may do, per environment. bootstrap.sh applies this file
# twice, replacing ENVIRONMENT with staging and then production, and builds a kubeconfig
# for each ServiceAccount (make-deployer-kubeconfig.sh). The kind job applies it the same way.
#
# The gate needs: its namespace's connectsphere-secrets (write), a restart of the services
# when that Secret changes, read access to the workloads for the health checks (through the
# API server's service proxy), and its own Argo CD Application (read, and the refresh
# annotation). Nothing else, and nothing in the other environment's namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: connectsphere-ENVIRONMENT
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: deployer-token
  namespace: connectsphere-ENVIRONMENT
  annotations:
    kubernetes.io/service-account.name: deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: connectsphere-ENVIRONMENT
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [connectsphere-secrets]
    verbs: [get, patch, update]
  # Create cannot be limited by name; the gate only ever creates connectsphere-secrets.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [services/proxy]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods, services, events, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [planning-core, planning-core-worker, registration, notification]
    verbs: [patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: connectsphere-ENVIRONMENT
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: connectsphere-ENVIRONMENT
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer-ENVIRONMENT
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [connectsphere-ENVIRONMENT]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-ENVIRONMENT
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer-ENVIRONMENT
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: connectsphere-ENVIRONMENT
