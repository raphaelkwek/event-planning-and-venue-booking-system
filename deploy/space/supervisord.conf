; ADR-0016 amendment: every process of the Space, kept running. start.sh has already run the
; migrations and exported the settings, which every program inherits. Logs go to the container's
; stdout, where the Space's log view shows them; no program logs a secret.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/cs/supervisord.pid
childlogdir=/tmp/cs

[unix_http_server]
file=/tmp/cs/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/cs/supervisor.sock

[program:redpanda]
command=/opt/redpanda/bin/rpk redpanda start --config /tmp/cs/redpanda/redpanda.yaml --smp=1 --memory=%(ENV_REDPANDA_MEMORY)s --reserve-memory=0M --overprovisioned --check=false --default-log-level=warn
priority=10
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Its SQLite file is where start.sh says (TEMPORAL_DB_FILE): on the VM, the environment's named volume.
[program:temporal]
command=/usr/local/bin/temporal server start-dev --ip=127.0.0.1 --port=7233 --headless --db-filename=%(ENV_TEMPORAL_DB_FILE)s --namespace=default --log-level=warn
priority=10
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:cerbos]
command=/usr/local/bin/cerbos server --config=/connectsphere/config.yaml --set=server.httpListenAddr=127.0.0.1:3592 --set=server.grpcListenAddr=127.0.0.1:3593
priority=10
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:planning-core]
command=node dist/index.js
directory=/app/backend/services/planning-core
priority=20
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Exits and is restarted until Temporal and Redpanda accept it, then stays up.
[program:worker]
command=node dist/temporal/worker.js
directory=/app/backend/services/planning-core
priority=30
autorestart=true
startsecs=10
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; EN-11's safety net (F1, L6): the completion and hold-expiry sweeps at start and every five
; minutes, whatever happened to Temporal. The sweeps log each run; see sweeps.sh.
[program:sweeps]
command=bash /app/deploy/space/sweeps.sh
directory=/app/backend/services/planning-core
priority=30
autorestart=true
startretries=100
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:registration]
command=node dist/index.js
directory=/app/backend/services/registration
priority=20
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:notification]
command=node dist/index.js
directory=/app/backend/services/notification
priority=20
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=/usr/local/bin/caddy run --config /app/deploy/space/Caddyfile --adapter caddyfile
priority=40
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
