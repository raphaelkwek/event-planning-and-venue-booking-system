# ADR-0016. The Cerbos PDP's configuration inside the connectsphere-cerbos image. The
# policies are read once from the image; there is nothing to watch, store or send.
server:
  httpListenAddr: ":3592"
  grpcListenAddr: ":3593"
storage:
  driver: disk
  disk:
    directory: /connectsphere/policies
    watchForChanges: false
audit:
  enabled: false
telemetry:
  disabled: true
