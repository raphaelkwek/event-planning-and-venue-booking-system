# Runs `npm run migrate -- all` before a release (ADR-0012: expand, migrate,
# contract, so the old and new pods both work against the migrated schema).
#
# Under Argo CD this is a PreSync hook: it runs before the new pods are rolled
# out, and the previous Job is deleted first so its immutable spec never blocks
# a sync. With plain kubectl it runs once per apply of a new name; the kind
# smoke deploy applies it once.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/raphaelkwek/connectsphere-migrate:latest
          imagePullPolicy: IfNotPresent
          # The image's default command; written out so the Job reads on its own.
          command: ["npm", "run", "migrate", "--", "all"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: connectsphere-secrets, key: DATABASE_URL }
            # npm writes its cache and logs under HOME; the root filesystem is read-only.
            - name: npm_config_cache
              value: /tmp/.npm
            - name: npm_config_update_notifier
              value: "false"
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
