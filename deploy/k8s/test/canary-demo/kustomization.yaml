# CI only. The real AnalysisTemplate with shorter timers so a demonstration takes minutes
# rather than the half hour a real rollout would: a measurement every 10 s, six of them,
# one failure tolerated. The queries and thresholds are untouched.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: canary-demo
resources:
  - ../../analysis
  - demo.yaml
patches:
  - target:
      kind: AnalysisTemplate
      name: error-rate-and-p95
    patch: |-
      - { op: replace, path: /spec/metrics/0/interval, value: 10s }
      - { op: replace, path: /spec/metrics/0/count, value: 6 }
      - { op: replace, path: /spec/metrics/1/interval, value: 10s }
      - { op: replace, path: /spec/metrics/1/count, value: 6 }
