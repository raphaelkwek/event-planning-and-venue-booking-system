# Debezium Server for ConnectSphere's transactional outbox (EN-05, ADR-0008).
#
# Reads the outbox tables of the services from Postgres's write-ahead
# log and publishes each new row to Kafka, so no process polls the tables. It
# produces exactly what the polling relay does (backend/services/planning-core/
# src/shared/outbox-relay.ts): the topic in the row's `topic` column, the row's
# `message_key` as the Kafka key, and the CloudEvent in `envelope` as the value.
# CI proves this with backend/scripts/cdc-parity-check.ts.
#
# Debezium Server is Debezium without Kafka Connect: this file is its whole
# configuration. A `${NAME}` is read from the environment and `${NAME:default}`
# falls back to the default. (Debezium Server expands a value twice, so a literal
# `${...}` cannot be written: the router below uses a regex group instead.)

# ---------------------------------------------------------------------------
# Source: Postgres logical replication
# ---------------------------------------------------------------------------
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.plugin.name=pgoutput

# A replication connection must be a direct connection. A pooler (Supavisor, in
# transaction or session mode) cannot carry one. Supabase's direct host is IPv6
# only on the Free plan, which is why the pod uses the node's network.
debezium.source.database.hostname=${CDC_DB_HOST}
debezium.source.database.port=${CDC_DB_PORT:5432}
debezium.source.database.user=${CDC_DB_USER}
debezium.source.database.password=${CDC_DB_PASSWORD}
debezium.source.database.dbname=${CDC_DB_NAME:postgres}
debezium.source.database.sslmode=${CDC_DB_SSLMODE:require}

# The tables the relays poll: planning-core's four modules (src/index.ts) and the registration service's. An outbox is
# added here when it gains one; the publication is made at start-up, so restart
# Debezium Server afterwards.
debezium.source.topic.prefix=connectsphere
debezium.source.table.include.list=event.outbox,equipment.outbox,change.outbox,venue.outbox,registration.outbox

# One slot and one publication, both named here. `filtered` makes a publication
# of just the tables above: the default, all_tables, needs a superuser, which
# Supabase's postgres role is not. The role must own the tables (it does: it
# ran the migrations).
debezium.source.slot.name=connectsphere_outbox
debezium.source.publication.name=connectsphere_outbox
debezium.source.publication.autocreate.mode=filtered

# Stream only rows written after the slot exists. Rows still unpublished when
# CDC is switched on are the relay's to publish (see the README's cut-over).
debezium.source.snapshot.mode=no_data

# The outbox is append-only: only inserts are messages. The relay's own UPDATE
# (published_at) and truncates are not.
debezium.source.skipped.operations=u,d,t
debezium.source.tombstones.on.delete=false

# Lets the slot move forward while the outbox is quiet, so Postgres can free WAL.
debezium.source.heartbeat.interval.ms=10000

# Where Debezium remembers how far it has read. Lost offsets are survivable: it
# resumes from the slot, and consumers deduplicate on the CloudEvent id.
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000

# ---------------------------------------------------------------------------
# Transforms: heartbeats are dropped; an outbox row becomes its CloudEvent
# ---------------------------------------------------------------------------
debezium.predicates=isHeartbeat
debezium.predicates.isHeartbeat.type=org.apache.kafka.connect.transforms.predicates.TopicNameMatches
debezium.predicates.isHeartbeat.pattern=__debezium-heartbeat.*

debezium.transforms=dropHeartbeat,outbox,contentType
debezium.transforms.dropHeartbeat.type=org.apache.kafka.connect.transforms.Filter
debezium.transforms.dropHeartbeat.predicate=isHeartbeat

# The outbox router. The value is the `envelope` column as the JSON text Postgres
# holds, not expanded: expanding drops nulls and empty arrays, which the
# CloudEvents data schemas require.
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.table.field.event.id=id
debezium.transforms.outbox.table.field.event.key=message_key
debezium.transforms.outbox.table.field.event.payload=envelope
debezium.transforms.outbox.table.expand.json.payload=false
debezium.transforms.outbox.route.by.field=topic
debezium.transforms.outbox.route.topic.regex=(.*)
debezium.transforms.outbox.route.topic.replacement=$1

# CloudEvents' Kafka binding, structured mode: the content type goes in a header.
debezium.transforms.contentType.type=org.apache.kafka.connect.transforms.InsertHeader
debezium.transforms.contentType.header=content-type
debezium.transforms.contentType.value.literal=application/cloudevents+json; charset=UTF-8

# ---------------------------------------------------------------------------
# Sink: Kafka
# ---------------------------------------------------------------------------
debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=${KAFKA_BROKERS}
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# Wait for every in-sync replica, and never duplicate a message on a retry.
debezium.sink.kafka.producer.acks=all
debezium.sink.kafka.producer.enable.idempotence=true
debezium.sink.kafka.producer.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
debezium.sink.kafka.producer.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
debezium.sink.kafka.producer.sasl.jaas.config=${KAFKA_SASL_LOGIN_MODULE:org.apache.kafka.common.security.scram.ScramLoginModule} required username="${KAFKA_SASL_USERNAME:unused}" password="${KAFKA_SASL_PASSWORD:unused}";

# The key and the value go out as the plain strings the router produced, which
# is what the relay sends. (json would wrap the CloudEvent in a JSON string.)
debezium.format.key=simplestring
debezium.format.value=simplestring

# Header values can only be written as JSON. Without the schema envelope the content-type
# header is the JSON string "application/cloudevents+json; charset=UTF-8", quotes included,
# where the relay sets the bare text. No consumer here reads it.
debezium.format.header=json
debezium.format.header.schemas.enable=false

# ---------------------------------------------------------------------------
# Server: health on the loopback only, since the pod shares the node's network
# ---------------------------------------------------------------------------
quarkus.http.host=127.0.0.1
quarkus.http.port=8089
