apiVersion: apps/v1
kind: Deployment
metadata:
  name: planning-core-worker
spec:
  template:
    spec:
      containers:
        - name: worker
          volumeMounts:
            - name: kafka-ca
              mountPath: /etc/connectsphere/kafka
              readOnly: true
      volumes:
        - name: kafka-ca
          secret:
            secretName: redpanda-tls
            items:
              - { key: ca.crt, path: ca.crt }
