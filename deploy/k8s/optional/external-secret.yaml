# Optional. Fills the connectsphere-secrets Secret from AWS Secrets Manager with the
# External Secrets Operator, instead of the documented `kubectl create secret` step
# (documentation/deploy.md). It holds references only: every value lives in
# Secrets Manager under the key below. Not part of the base because it needs the
# operator's CRDs; apply it per environment once the operator is installed.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      # The operator's service account is bound to an IAM role (IRSA); no key is stored.
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: connectsphere-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: connectsphere-secrets
    creationPolicy: Owner
  # One Secrets Manager secret holding a JSON object with the keys listed in
  # documentation/deploy.md (DATABASE_URL, SUPABASE_URL, ...). Every key is copied.
  dataFrom:
    - extract:
        key: connectsphere/staging/app
