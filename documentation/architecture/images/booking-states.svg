="12.5" ry="12.5"/><text x="2441.87" y="330.44" fill="#000" font-size="14" textLength="75.64">Withdrawn</text><g class="start_entity" data-qualified-name="request..start.request" id="ent0011" data-source-line="12"><ellipse cx="2312.69" cy="149.594" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name="request..end.request" id="ent0016" data-source-line="16"><ellipse cx="2312.69" cy="393.594" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="2312.69" cy="393.594" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><!--link *start*request to PENDING--><g class="link" data-entity-1="ent0011" data-entity-2="ent0002" id="lnk12" data-source-line="12" data-link-type="dependency"><path d="M2312.69,159.884 C2312.69,172.604 2312.69,190.734 2312.69,207.284" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*request-to-PENDING"/><polygon points="2312.69,212.284,2316.69,203.284,2312.69,207.284,2308.69,203.284,2312.69,212.284" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="2313.69" y="190.661" fill="#000" font-size="13" textLength="419.459">coordinator submits (one pending request per event and venue)</text></g><!--link PENDING to APPROVED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk13" data-source-line="13" data-link-type="dependency"><path d="M2279.24,237.804 C2242.34,243.224 2186.47,253.964 2173.69,270.594 C2166.07,280.504 2167.481,289.648 2172.941,300.738" style="stroke:#181818;stroke-width:1;" fill="none" id="PENDING-to-APPROVED"/><polygon points="2175.15,305.224,2174.763,295.382,2172.941,300.738,2167.586,298.916,2175.15,305.224" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="2174.69" y="283.661" fill="#000" font-size="13" textLength="133.561">Venue Staff approve</text></g><!--link PENDING to REJECTED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk14" data-source-line="14" data-link-type="dependency"><path d="M2312.69,252.894 C2312.69,268.334 2312.69,284.884 2312.69,300.324" style="stroke:#181818;stroke-width:1;" fill="none" id="PENDING-to-REJECTED"/><polygon points="2312.69,305.324,2316.69,296.324,2312.69,300.324,2308.69,296.324,2312.69,305.324" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="2313.69" y="283.661" fill="#000" font-size="13" textLength="213.649">Venue Staff reject, with a reason</text></g><!--link PENDING to WITHDRAWN--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk15" data-source-line="15" data-link-type="dependency"><path d="M2346.31,234.284 C2401.07,236.194 2505.76,243.404 2528.69,270.594 C2538.56,282.304 2532.181,292.031 2518.451,302.181" style="stroke:#181818;stroke-width:1;" fill="none" id="PENDING-to-WITHDRAWN"/><polygon points="2514.43,305.154,2524.045,303.02,2518.451,302.181,2519.289,296.587,2514.43,305.154" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="2533.57" y="283.661" fill="#000" font-size="13" textLength="344.379">coordinator withdraws, or the event is cancelled (F4)</text></g><!--link APPROVED to *end*request--><g class="link" data-entity-1="ent0003" data-entity-2="ent0016" id="lnk17" data-source-line="16" data-link-type="dependency"><path d="M2224.52,346.044 C2251.59,360.334 2282.028,376.409 2298.638,385.179" style="stroke:#181818;stroke-width:1;" fill="none" id="APPROVED-to-*end*request"/><polygon points="2303.06,387.514,2296.969,379.774,2298.638,385.179,2293.234,386.849,2303.06,387.514" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link REJECTED to *end*request--><g class="link" data-entity-1="ent0004" data-entity-2="ent0016" id="lnk18" data-source-line="17" data-link-type="dependency"><path d="M2312.69,346.044 C2312.