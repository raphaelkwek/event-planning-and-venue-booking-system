388.44" fill="#000" font-size="14" textLength="64.217">Released</text><rect x="1070.88" y="305.594" width="63.163" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1075.88" y="330.44" fill="#000" font-size="14" textLength="53.163">Expired</text><g class="start_entity" data-qualified-name="slot..start.slot" id="ent0020" data-source-line="26"><ellipse cx="43.46" cy="91.594" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name="slot..end.slot" id="ent0027" data-source-line="32"><ellipse cx="810.46" cy="451.594" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="810.46" cy="451.594" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><!--link *start*slot to HELD--><g class="link" data-entity-1="ent0020" data-entity-2="ent0007" id="lnk21" data-source-line="26" data-link-type="dependency"><path d="M53.44,94.674 C103.68,105.164 324.546,151.272 401.096,167.252" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*slot-to-HELD"/><polygon points="405.99,168.274,397.997,162.519,401.096,167.252,396.363,170.35,405.99,168.274" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="250.1" y="132.661" fill="#000" font-size="13" textLength="102.032">a hold is placed</text></g><!--link *start*slot to CONFIRMED--><g class="link" data-entity-1="ent0020" data-entity-2="ent0008" id="lnk22" data-source-line="27" data-link-type="dependency"><path d="M43.26,101.964 C42.92,124.254 42.92,182.084 50.46,229.594 C51.38,235.374 51.537,236.729 53.067,242.349" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*slot-to-CONFIRMED"/><polygon points="54.38,247.174,55.875,237.439,53.067,242.349,48.156,239.541,54.38,247.174" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="47.24" y="179.161" fill="#000" font-size="13" textLength="142.162">a request is approved</text></g><!--link HELD to CONFIRMED--><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" id="lnk23" data-source-line="28" data-link-type="dependency"><path d="M406.09,177.214 C324.44,182.534 73.18,199.884 61.46,212.594 C53.07,221.694 52.23,230.835 54.19,242.335" style="stroke:#181818;stroke-width:1;" fill="none" id="HELD-to-CONFIRMED"/><polygon points="55.03,247.264,57.461,237.72,54.19,242.335,49.575,239.064,55.03,247.264" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="62.46" y="225.661" fill="#000" font-size="13" textLength="572.33">the request converted from the hold is approved (conversion alone keeps the slot Held)</text></g><!--link HELD to RELEASED--><g class="link" data-entity-1="ent0007" data-entity-2="ent0009" id="lnk24" data-source-line="29" data-link-type="dependency"><path d="M456.67,176.464 C505.86,178.734 611.88,186.604 635.46,212.594 C645.41,223.564 648.264,316.155 649.074,358.325" style="stroke:#181818;stroke-width:1;" fill="none" id="HELD-to-RELEASED"/><polygon points="649.17,363.324,652.996,354.249,649.074,358.325,644.998,354.402,649.17,363.324" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="647.39" y="272.161" fill="#000" font-size="13" textLength="553.611">the hold is released, or its request is withdrawn or rejected, or the event is cancelled</text></g><!--link HELD to EXPIRED--><g class="link" data-entity-1="ent0007" data-entity-2="ent0010" id="lnk25" data-source-line="30" data-link-type="dependency"><path d="M456.7,175.964 C584.54,178.084 1156.61,190.714 1208.46,247.594 C1220.44,260.734 1218.76,273.094 1208.46,287.594 C1191.82,311.034 1164.119,319.105 1139.429,322.285" style="stroke:#181818;stroke-width:1;" fill="none" id="HELD-to-EXPIRED"/><polygon points="1134.47,322.924,1143.907,325.741,1139.429,322.285,1142.885,317.807,1134.47,322.924" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1165.63" y="225.661" fill="#000" font-size="13" textLength="388.273">the hold passes its expiry (only while the hold itself is Held)</text></g><!--link CONFIRMED to RELEASED--><g class="link" data-entity-1="ent0008" data-entity-2="ent0009" id="lnk26" data-source-line="31" data-link-type="dependency"><path d="M74.16,288.004 C88.39,306.434 112.47,333.114 140.46,345.594 C224.82,383.214 504.41,384.14 607.11,383.18" style="stroke:#181818;stroke-width:1;" fill="none" id="CONFIRMED-to-RELEASED"/><polygon points="612.11,383.134,603.073,379.218,607.11,383.18,603.148,387.218,612.11,383.134" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="141.46" y="330.161" fill="#000" font-size="13" textLength="493.568">the event is cancelled (F4), or an approved replacement takes over (CR-02)</text></g><!--link RELEASED to *end*slot--><g class="link" data-entity-1="ent0009" data-entity-2="ent0027" id="lnk28" data-source-line="32" data-link-type="dependency"><path d="M686.8,399.904 C723.78,415.054 773.363,435.388 795.673,444.528" style="stroke:#181818;stroke-width:1;" fill="none" id="RELEASED-to-*end*slot"/><polygon points="800.3,446.424,793.488,439.31,795.673,444.528,790.455,446.713,800.3,446.424" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link EXPIRED to *end*slot--><g class="link" data-entity-1="ent0010" data-entity-2="ent0027" id="lnk29" data-source-line="33" data-link-type="dependency"><path d="M1070.66,340.104 C1005.62,367.714 864.812,427.52 825.192,444.34" style="stroke:#181818;stroke-width:1;" fill="none" id="EXPIRED-to-*end*slot"/><polygon points="820.59,446.294,830.437,446.459,825.192,444.34,827.311,439.095,820.59,446.294" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g></g><g class="entity" data-qualified-name="GMN30" id="ent0031" data-source-l