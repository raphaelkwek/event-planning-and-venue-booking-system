IRMED to RELEASED--><g class="link" data-entity-1="ent0008" data-entity-2="ent0009" id="lnk26" data-source-line="31" data-link-type="dependency"><path d="M310.36,270.344 C227.46,274.254 48.45,285.014 30.1,305.594 C18.27,318.864 18,332.574 30.1,345.594 C62.04,379.944 384.39,382.786 496.6,382.736" style="stroke:#181818;stroke-width:1;" fill="none" id="CONFIRMED-to-RELEASED"/><polygon points="501.6,382.734,492.6,378.734,496.6,382.734,492.6,386.734,501.6,382.734" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="31.1" y="330.161" fill="#000" font-size="13" textLength="493.568">the event is cancelled (F4), or an approved replacement takes over (CR-02)</text></g><!--link RELEASED to *end*slot--><g class="link" data-entity-1="ent0009" data-entity-2="ent0027" id="lnk28" data-source-line="32" data-link-type="dependency"><path d="M562.08,404.044 C577.9,417.424 594.163,431.174 605.163,440.484" style="stroke:#181818;stroke-width:1;" fill="none" id="RELEASED-to-*end*slot"/><polygon points="608.98,443.714,604.694,434.846,605.163,440.484,599.526,440.953,608.98,443.714" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link EXPIRED to *end*slot--><g class="link" data-entity-1="ent0010" data-entity-2="ent0027" id="lnk29" data-source-line="33" data-link-type="dependency"><path d="M665.2,345.964 C652.8,372.944 632.898,416.231 623.568,436.531" style="stroke:#181818;stroke-width:1;" fill="none" id="EXPIRED-to-*end*slot"/><polygon points="621.48,441.074,628.873,434.567,623.568,436.531,621.604,431.226,621.48,441.074" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g></g><g class="entity" data-qualified-name="GMN30" id="ent0031" data-source-line="37"><path d="M886.38,224.687 L886.38,255.947 L851.56,259.947 L886.38,263.947 L886.38,295.218 A0,0 0 0 0 886.38,295.218 L1373.977,295.218 A0,0 0 0 0 1373.977,295.218 L1373.977,234.687 L