<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:2038px;height:541px;background:#FFFFFF;" width="2038px" height="541px" viewBox="0 0 2038 541" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="721.821" y="22.995" fill="#000" font-size="14" textLength="588.314" font-weight="700">Hold (L1 to L6, CR-04): a tentative claim on a venue period, with an expiry</text></g><rect x="7" y="140.297" width="84.997" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="12" y="165.144" fill="#000" font-size="14" textLength="74.997">Requested</text><rect x="444.5" y="272.557" width="50" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="453.542" y="297.404" fill="#000" font-size="14" textLength="31.917">Held</text><rect x="920.07" y="404.827" width="82.857" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="925.07" y="429.674" fill="#000" font-size="14" textLength="72.857">Converted</text><rect x="41.39" y="404.827" width="74.217" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="46.39" y="429.674" fill="#000" font-size="14" textLength="64.217">Released</text><rect x="450.92" y="404.827" width="63.163" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="455.92" y="429.674" fill="#000" font-size="14" textLength="53.163">Expired</text><g class="start_entity" data-qualified-name=".start." id="ent0006" data-source-line="14"><ellipse cx="49.5" cy="53.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0013" data-source-line="20"><ellipse cx="482.5" cy="516.827" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="482.5" cy="516.827" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="25"><path d="M529.64,257.297 L529.64,288.557 L494.78,292.557 L529.64,296.557 L529.64,327.828 A0,0 0 0 0 529.64,327.828 L1011.359,327.828 A0,0 0 0 0 1011.359,327.828 L1011.359,267.297 L1001.359,257.297 L529.64,257.297 A0,0 0 0 0 529.64,257.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1001.359,257.297 L1001.359,267.297 L1011.359,267.297 L1001.359,257.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="535.64" y="274.364" fill="#000" font-size="13" textLength="359.119">A reminder goes out at the expiry minus the lead time.</text><text x="535.64" y="289.497" fill="#000" font-size="13" textLength="402.34">Venue Staff may move the expiry (PATCH /holds/{id}/expiry);</text><text x="535.64" y="304.629" fill="#000" font-size="13" textLength="372.246">the timers restart. The expiry is decided under the hold's</text><text x="535.64" y="319.762" fill="#000" font-size="13" textLength="460.719">row lock with the database clock, so an early or late timer is harmless.</text></g><!--link *start* to REQUESTED--><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" id="lnk7" data-source-line="14" data-link-type="dependency"><path d="M49.5,63.617 C49.5,80.677 49.5,112.277 49.5,134.937" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-REQUESTED"/><polygon points="49.5,139.937,53.5,130.937,49.5,134.937,45.5,130.937,49.5,139.937" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="50.5" y="106.364" fill="#000" font-size="13" textLength="411.811">coordinator asks for a hold (one live hold per event and venue)</text></g><!--link REQUESTED to HELD--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="15" data-link-type="dependency"><path d="M92.43,169.557 C160.37,183.367 296.16,213.937 405.5,257.297 C418.74,262.547 428.406,267.379 439.936,273.889" style="stroke:#181818;stroke-width:1;" fill="none" id="REQUESTED-to-HELD"/><polygon points="444.29,276.347,438.42,268.439,439.936,273.889,434.486,275.405,444.29,276.347" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="320.73" y="223.364" fill="#000" font-size="13" textLength="365.98">Venue Staff place it, with an expiry (inserts a HELD slot)</text></g><!--link REQUESTED to RELEASED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk9" data-source-line="16" data-link-type="dependency"><path d="M47.89,180.657 C45.68,211.847 42.8,275.047 50.5,327.827 C54.48,355.137 62.628,380.852 69.508,399.982" style="stroke:#181818;stroke-width:1;" fill="none" id="REQUESTED-to-RELEASED"/><polygon points="71.2,404.687,71.918,394.864,69.508,399.982,64.39,397.572,71.2,404.687" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="51.5" y="297.124" fill="#000" font-size="13" textLength="375.75">released before it is placed, or the event is cancelled (F4)</text></g><!--link HELD to CONVERTED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk10" data-source-line="17" data-link-type="dependency"><path d="M488.4,312.887 C495.37,318.787 503.73,324.567 512.5,327.827 C593.91,358.067 1233.28,295.257 1293.5,357.827 C1334.91,400.857 1106.284,416.918 1008.244,421.808" style="stroke:#181818;stroke-width:1;" fill="none" id="HELD-to-CONVERTED"/><polygon points="1003.25,422.057,1012.438,425.604,1008.244,421.808,1012.04,417.614,1003.25,422.057" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1299.35" y="370.894" fill="#000" font-size="13" textLength="723.607">converted into a booking request (the slot stays Held, now under the request's reference, until M1 approves it)</text></g><!--link HELD to RELEASED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk11" data-source-line="18" data-link-type="dependency"><path d="M444.04,310.167 C432.69,316.767 418.88,323.757 405.5,327.827 C341.19,347.397 158.12,317.287 104.5,357.827 C89.96,368.817 84.455,384.241 81.625,399.451" style="stroke:#181818;stroke-width:1;" fill="none" id="HELD-to-RELEASED"/><polygon points="80.71,404.367,86.289,396.25,81.625,399.451,78.424,394.787,80.71,404.367" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="105.5" y="370.894" fill="#000" font-size="13" textLength="362.521">released, or the event is cancelled (the slot is released)</text></g><!--link HELD to EXPIRED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk12" data-source-line="19" data-link-type="dependency"><path d="M471.42,312.787 C473.87,337.407 477.614,374.882 480.074,399.552" style="stroke:#181818;stroke-width:1;" fill="none" id="HELD-to-EXPIRED"/><polygon points="480.57,404.527,483.657,395.174,480.074,399.552,475.697,395.968,480.57,404.527" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="478.55" y="370.894" fill="#000" font-size="13" textLength="808.069">the expiry is reached, by the HoldExpiry timer, the jobs:expire-holds sweep or a slot insert at the venue (the slot is Expired)</text></g><!--link CONVERTED to *end*--><g class="link" data-entity-1="ent0003" data-entity-2="ent0013" id="lnk14" data-source-line="20" data-link-type="dependency"><path d="M919.83,433.657 C816.04,453.157 555.144,502.173 498.234,512.873" style="stroke:#181818;stroke-width:1;" fill="none" id="CONVERTED-to-*end*"/><polygon points="493.32,513.797,502.904,516.065,498.234,512.873,501.426,508.203,493.32,513.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link RELEASED to *end*--><g class="link" data-entity-1="ent0004" data-entity-2="ent0013" id="lnk15" data-source-line="21" data-link-type="dependency"><path d="M115.78,434.137 C203.68,453.717 415.47,500.9 466.66,512.3" style="stroke:#181818;stroke-width:1;" fill="none" id="RELEASED-to-*end*"/><polygon points="471.54,513.387,463.625,507.526,466.66,512.3,461.886,515.335,471.54,513.387" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link EXPIRED to *end*--><g class="link" data-entity-1="ent0005" data-entity-2="ent0013" id="lnk16" data-source-line="22" data-link-type="dependency"><path d="M482.5,444.917 C482.5,463.487 482.5,485.997 482.5,500.697" style="stroke:#181818;stroke-width:1;" fill="none" id="EXPIRED-to-*end*"/><polygon points="482.5,505.697,486.5,496.697,482.5,500.697,478.5,496.697,482.5,505.697" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src VLJVRzCm47xFNt7YPIrg6oPDF6mIqbI2YbHWT6D2GZouyQKnTNp1TbignF_EsKxIRa8yDRsxxxjVdyyhhn4Mf2MCbfVW2PQl9p1VJLzTZQz1W4VZXLTxX58BrG0PDkxHx11Qj8ha10xAro0CuAzMsMDs0GjXvFHWbMSmL9OQQ4ZkDBey0dEBBUKrftGpxnWf8Vmf8hotF4L8QeGo4SC1Dvp3SLKxXmwKWRKejsXatlAls32e9EEjABtBdIqJnQ9BDuE76i6h1YqdilnPf_PJUZYGtLQQ3fnYr6fXZ3ARQKaM8vN7fYKhTDw7kVn9wUDPLYk9m67-219TQLNh5PdCRPLfXHKDk5f8EZ0jL48xpBBG2iAB5VxSeVCeNu1mi2e-Vodk7ugtlNk1EdaMnN8mpidiqVQO-QUFZyNg3BD2ZS8DZClYzlxaZ4LtlkBhtViLkx9lBx_3TFhcb1wkeIIoKXdXoNBira4LFkBEO4G6GGTvnByi2K2UjuyxZ8CVPoUkm1pAPzB7AA5xBweAUCubWlBFfGGZPHotnujACAV9F-Vhss9EsxKBQ-GI0oCebzXPfbnqs7KgZ-sbC2LgpU6ZTrVZB2O8XCCKO-lTV5bc_3G4h8csONKsBGj6WJAK5GHvvENmbYPWw00x8p5bx68l77zLQ97JJjZjbOOFbo3Qrj8-2DcV5V6FhlxRmL26SWFWZAxRBxD5WZJT62hAEb2lZyyVGdmYasZzGMjt7K4uZSyMt06nXIY3b3Nk2OIFyUayFAcf4ziuEqqtrCLoouPMUqDVRFy_CyHwjMfJUw0gwH_WbejlL1poXdXyj1loT_snT-UYWUSXOqCp1fuhhn4SnjC_XutkRX_c2qW7Al-jv9yyUSOtZFQdws5vgSBwT55ECvLOyWcGPm88J1UEmPPreQdS9fq7bnHUh7bPV5tPFW57KVx2wcCOhmulDQOBpBMm3Tz4Dylusa6Ooby0?></g></svg>