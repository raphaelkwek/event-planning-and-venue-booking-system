ta-source-line="15" data-link-type="dependency"><path d="M84.58,180.657 C132.6,207.167 213.292,251.711 255.662,275.091" style="stroke:#181818;stroke-width:1;" fill="none" id="REQUESTED-to-HELD"/><polygon points="260.04,277.507,254.093,269.656,255.662,275.091,250.228,276.661,260.04,277.507" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="168.5" y="223.364" fill="#000" font-size="13" textLength="365.98">Venue Staff place it, with an expiry (inserts a HELD slot)</text></g><!--link REQUESTED to RELEASED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk9" data-source-line="16" data-link-type="dependency"><path d="M51.08,180.297 C53.72,211.247 59.32,274.447 65.5,327.827 C68.57,354.387 72.125,380.038 74.925,399.418" style="stroke:#181818;stroke-width:1;" fill="none" id="REQUESTED-to-RELEASED"/><polygon points="75.64,404.367,78.312,394.887,74.925,399.418,70.394,396.031,75.64,404.367" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="66.5" y="297.124" fill="#000" font-size="13" textLength="176.916">released before it is placed</text></g><!--link HELD to CONVERTED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk10" data-source-line="17" data-link-type="dependency"><path d="M304.91,313.027 C311.8,318.787 319.98,324.457 328.5,327.827 C404.99,358.107 641.73,297.337 697.5,357.827 C723.98,386.547 670.593,404.818 627.143,414.798" style="stroke:#181818;stroke-width:1;" fill="none" id="HELD-to-CONVERTED"/><polygon points="622.27,415.917,631.937,417.801,627.143,414.798,630.146,410.004,622.27,415.917" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="705.13" y="370.894" fill="#000" font-size="13" textLength="282.883">converted into a booking request's booking</text></g><!--link HELD to RELEASED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk11" data-source-line="18" data-link-type="dependency"><path d="M260.25,305.617 C244.92,312.647 224.84,321.387 206.5,327.827 C158.69,344.617 132.33,321.997 96.5,357.827 C84.24,370.087 80.547,384.846 79.257,399.556" style="stroke:#181818;stroke-width:1;" fill="none" id="HELD-to-RELEASED"/><polygon points="78.82,404.537,83.591,395.921,79.257,399.556,75.622,395.222,78.82,404.537" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="97.5" y="370.894" fill="#000" font-size="13" textLength="193.711">released (the slot is released)</text></g><!--link HELD to EXPIRED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk12" data-source-line="19" data-link-type="dependency"><path d="M289.63,312.787 C294.92,337.407 303,374.968 308.3,399.638" style="stroke:#181818;stroke-width:1;" fill="none" id="HELD-to-EXPIRED"/><polygon points="309.35,404.527,311.37,394.887,308.3,399.638,303.549,396.568,309.35,404.527" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="303.83" y="370.894" fill="#000" font-size="13" textLength="385.734">the HoldExpiry timer fires at the expiry (the slot is Expired)</text></g><!--link CONVERTED to *end*--><g class="link" data-entity-1="ent0003" data-entity-2="ent0013" id="lnk14" data-source-line="20" data-link-type="dependency"><path d="M538.78,439.887 C475.57,461.197 363.878,498.85 328.618,510.73" style="stroke:#181818;stroke-width:1;" fill="none" id="CONVERTED-to-*end*"/><polygon points="323.88,512.327,333.686,513.244,328.618,510.73,331.132,505.663,323.88,512.327" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link RELEASED to *end*--><g class="link" data-entity-1="ent0004" data-entity-2="ent0013" id="lnk15" data-source-line="21" data-link-type="dependency"><path d="M115.99,440.187 C171.2,461.327 266.6,497.87 298.66,510.14" style="stroke:#181818;stroke-width:1;" fill="none" 