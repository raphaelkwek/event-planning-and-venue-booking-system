<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1004px;height:541px;background:#FFFFFF;" width="1004px" height="541px" viewBox="0 0 1004 541" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="204.349" y="22.995" fill="#000" font-size="14" textLength="588.314" font-weight="700">Hold (L1 to L6, CR-04): a tentative claim on a venue period, with an expiry</text></g><rect x="7" y="140.297" width="84.997" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="12" y="165.144" fill="#000" font-size="14" textLength="74.997">Requested</text><rect x="260.5" y="272.557" width="50" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="269.542" y="297.404" fill="#000" font-size="14" textLength="31.917">Held</text><rect x="539.07" y="404.827" width="82.857" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="544.07" y="429.674" fill="#000" font-size="14" textLength="72.857">Converted</text><rect x="41.39" y="404.827" width="74.217" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="46.39" y="429.674" fill="#000" font-size="14" textLength="64.217">Released</text><rect x="281.92" y="404.827" width="63.163" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="286.92" y="429.674" fill="#000" font-size="14" textLength="53.163">Expired</text><g class="start_entity" data-qualified-name=".start." id="ent0006" data-source-line="14"><ellipse cx="49.5" cy="53.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0013" data-source-line="20"><ellipse cx="313.5" 