ED"/><polygon points="359.96,247.224,369.375,244.332,363.731,243.941,364.122,238.298,359.96,247.224" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="376.62" y="225.661" fill="#000" font-size="13" textLength="198.707">the event is cancelled (R3, F4)</text></g><!--link WITHDRAWN to *end*reg--><g class="link" data-entity-1="ent0003" data-entity-2="ent0014" id="lnk15" data-source-line="14" data-link-type="dependency"><path d="M182.44,288.044 C191.82,300.664 200.589,312.48 207.689,322.04" style="stroke:#181818;stroke-width:1;" fill="none" id="WITHDRAWN-to-*end*reg"/><polygon points="210.67,326.054,208.515,316.444,207.689,322.04,202.093,321.213,210.67,326.054" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link CANCELLED to *end*reg--><g class="link" data-entity-1="ent0004" data-entity-2="ent0014" id="lnk16" data-source-line="15" data-link-type="dependency"><path d="M297.42,288.044 C272.99,302.184 245.938,317.85 230.608,326.72" style="stroke:#181818;stroke-width:1;" fill="none" id="CANCELLED-to-*end*reg"/><polygon points="226.28,329.224,236.073,328.179,230.608,326.72,232.067,321.254,226.28,329.224" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g></g><g class="entity" data-qualified-name="wait" id="ent0005" data-source-line="18"><path d="M894.72,44.297 L1825.214,44.297 A12.5,12.5 0 0 1 1837.714,56.797 L1837.714,70.594 L882.22,70.594 L882.22,56.797 A12.5,12.5 0 0 1 894.72,44.297" fill="#F1F1F1"/><rect x="882.22" y="44.297" width="955.494" height="315.297" fill="none" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="882.22" y1="70.594" x2="1837.714" y2="70.594" style="stroke:#181818;stroke-width:0.5;"/><text x="1313.052" y="62.292" fill="#000" font-size="14" textLength="93.83">Waitlist entry</text><rect x="1415.84" y="154.594" width="79.863" height="40" fill="#F1F1F1" style="stroke:#