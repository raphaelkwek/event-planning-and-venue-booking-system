# CI v1 (SPM-114, first step of EN-06). Every pull request and every push to
# main must pass lint, typecheck, build and unit tests before it can merge.
#
# The integration job (EN-06.1, SPM-162) runs every test that needs a database
# against a throwaway Postgres on the runner. CI never touches the team's shared
# Supabase project (CLAUDE.md, EN-06): the job refuses to start if DATABASE_URL
# points anywhere but the runner itself.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # EN-14: run by hand to remake the browser tests' visual baselines on Linux (see the e2e job).
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Remake every visual baseline and upload them as the visual-baselines artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Unit tests import modules that read these at load time. They are
      # placeholders, not secrets: nothing in a unit test connects anywhere,
      # and the .invalid domain and port 1 guarantee that nothing can.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci_unused
      SUPABASE_URL: https://ci.invalid
      SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_JWKS_URL: https://ci.invalid/auth/v1/.well-known/jwks.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (ESLint and module boundaries)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests (with coverage thresholds)
        run: npm run test:unit

      # EN-22: the script tests already ran inside test:unit; this writes their JUnit results,
      # one file per test file, for the traceability job. A failure here fails the job as well.
      - name: Script tests (JUnit results)
        if: always()
        run: |
          mkdir -p script-results
          status=0
          for f in documentation/scripts/confluence-digest.test.ts documentation/scripts/traceability-matrix.test.ts documentation/scripts/dora.test.ts; do
            npx tsx --test --test-reporter=junit --test-reporter-destination="script-results/$(echo "$f" | sed 's#/#__#g').xml" "$f" || status=1
          done
          exit $status

      - name: Coverage summary
        if: always()
        run: node .github/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            backend/services/planning-core/coverage/
            backend/services/notification/coverage/
            backend/services/registration/coverage/
            backend/packages/contracts/coverage/
            backend/packages/kafka/coverage/
            backend/packages/telemetry/coverage/
            frontend/coverage/
          if-no-files-found: ignore

      # EN-22: the JSON reports vitest wrote (see each vitest config), for the traceability job.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: |
            backend/services/planning-core/reports/vitest-unit.json
            backend/services/notification/reports/vitest-unit.json
            backend/services/registration/reports/vitest-unit.json
            backend/packages/contracts/reports/vitest-unit.json
            backend/packages/kafka/reports/vitest-unit.json
            frontend/reports/vitest-unit.json
            script-results/
          if-no-files-found: ignore

      # A2's permission rules (ADR-0010). Cerbos has no Windows build, so CI is
      # where most of the team sees these run; backend/scripts/cerbos.ts
      # downloads the pinned release and checks its SHA-256 first.
      - name: Permission policy tests (Cerbos)
        run: npm run policies:test

  integration:
    name: Integration tests (throwaway Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A service container is the one place CLAUDE.md allows a container: CI only.
    # It lives as long as this job and is thrown away with the runner.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: connectsphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d connectsphere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # EN-07 (ADR-0010): the Cerbos policy decision point every route asks. The
      # image is the release backend/scripts/cerbos.ts pins. It starts with an empty
      # policy folder, outside the workspace so checkout isn't disturbed; the step
      # after checkout copies policies/ in and restarts it.
      cerbos:
        image: ghcr.io/cerbos/cerbos:0.56.0
        ports:
          - 3592:3592
        volumes:
          - /tmp/cerbos-policies:/policies
    env:
      # The runner's own database. These are throwaway credentials for a
      # container nobody else can reach, not secrets.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/connectsphere_ci
      # Off by default; on here so CI proves the 5 s statement timeout is accepted by Postgres (implementation.md 4.7).
      DB_STATEMENT_TIMEOUT_MS: "5000"
      # Tests replace token checks with stubs, so nothing calls Supabase or Kafka.
      # The services still read these when they load, hence placeholders that
      # cannot reach anything (.invalid, port 1).
      SUPABASE_URL: https://ci.invalid
      SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_JWKS_URL: https://ci.invalid/auth/v1/.well-known/jwks.json
      KAFKA_BROKERS: 127.0.0.1:1
      KAFKA_SASL_MECHANISM: plain
      KAFKA_SASL_USERNAME: ci
      KAFKA_SASL_PASSWORD: ci-placeholder
      # The Cerbos service container above. Integration tests and the generated
      # matrix (EN-07.3) ask it, exactly as planning-core does when deployed.
      CERBOS_URL: http://127.0.0.1:3592
    steps:
      - name: Refuse any database but the runner's own
        run: |
          case "$DATABASE_URL" in
            postgres://*@127.0.0.1:5432/*|postgres://*@localhost:5432/*) echo "DATABASE_URL is the runner's throwaway Postgres." ;;
            *) echo "::error::DATABASE_URL must point at the runner's own Postgres, never a shared database (EN-06)"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Load the policies into the Cerbos service container
        run: |
          sudo cp -r policies/derived_roles policies/resources /tmp/cerbos-policies/
          docker restart "${{ job.services.cerbos.id }}"
          curl --silent --show-error --fail --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors http://127.0.0.1:3592/_cerbos/health
          echo
          docker logs "${{ job.services.cerbos.id }}" 2>&1 | tail -n 5

      - name: Build the database from the migrations (every module and service, with seeds)
        run: npm run migrate:all

      # EN-15: a real flagd serving the committed flag file, so one test can prove the provider
      # reads from it. A container, in CI only (ADR-0012).
      - name: Start flagd
        run: |
          docker run -d --name flagd -p 8013:8013 -v "$PWD/flags:/flags:ro"             ghcr.io/open-feature/flagd:v0.18.0 start --uri file:/flags/flags.flagd.json
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/8013) 2>/dev/null; then echo "flagd is listening"; exit 0; fi
            sleep 1
          done
          docker logs flagd
          echo "::error::flagd did not start"
          exit 1

      - name: Integration tests with coverage (planning-core)
        # SPM-116's floor for code outside domain/ is enforced here, the one run
        # that executes repo/ and api/ (vitest.config.ts).
        run: npm run test:coverage -w @connectsphere/planning-core
        env:
          # EN-15-T8 reads this flagd; without it the test is skipped.
          FLAGD_INTEGRATION_HOST: 127.0.0.1

      - name: Integration tests (notification)
        if: always()
        run: npm test -w @connectsphere/notification

      - name: Integration tests (registration)
        if: always()
        run: npm test -w @connectsphere/registration

      # EN-03 (ADR-0007): every hash chain the integration tests wrote must
      # verify, and the same command must then catch one edited entry, naming
      # it (EN-03-T14, EN-03-T18). The edit is made on this runner's throwaway
      # Postgres only; the script refuses any other database.
      - name: Event store tamper check (EN-03)
        run: |
          npm run --silent event-store:verify
          edited="$(npx tsx backend/services/planning-core/scripts/ci-tamper-event-stream.ts)"
          echo "Edited $edited."
          if npm run --silent event-store:verify > verify.log 2>&1; then
            cat verify.log
            echo "::error::event-store:verify passed after an entry was edited"
            exit 1
          fi
          cat verify.log
          grep -F "First broken link: $edited (HASH_MISMATCH)" verify.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: |
            backend/services/planning-core/reports/vitest-integration.json
            backend/services/notification/reports/vitest-integration.json
            backend/services/registration/reports/vitest-integration.json
          if-no-files-found: ignore

  # EN-14 (SPM-132). Browser tests against an ephemeral stack that lives only as long as this
  # job: a throwaway Postgres built from every migration, a fake Supabase Auth server, the three
  # services and the web app (tests/playwright.config.ts starts them). Kafka is left out on
  # purpose; the services run without it and keep their messages in the outbox. Not a required
  # check. documentation/evidence/EN-14/README.md explains the stack and the artifacts.
  e2e:
    name: Browser tests (Playwright, ephemeral stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: connectsphere_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d connectsphere_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The runner's own database: throwaway credentials for a container nobody else can reach.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/connectsphere_e2e
    steps:
      - name: Refuse any database but the runner's own
        run: |
          case "$DATABASE_URL" in
            postgres://*@127.0.0.1:5432/*|postgres://*@localhost:5432/*) echo "DATABASE_URL is the runner's throwaway Postgres." ;;
            *) echo "::error::DATABASE_URL must point at the runner's own Postgres, never a shared database (EN-06)"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the database from the migrations (every module and service, with seeds)
        run: npm run migrate:all

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        env:
          # A missing baseline is written and its test fails softly; a manual run remakes them all.
          UPDATE_SNAPSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots && 'all' || 'missing' }}
        run: npx playwright test --config tests/playwright.config.ts --update-snapshots="$UPDATE_SNAPSHOTS"

      - name: Check every journey is tagged with its story and card
        if: always() && hashFiles('tests/test-results/results.json') != ''
        run: |
          node .github/scripts/e2e-tags-check.mjs
          echo "Journeys tagged @D4:"
          npx playwright test --config tests/playwright.config.ts --list --grep @D4 --reporter=list

      - name: Browser test summary
        if: always()
        run: node .github/scripts/e2e-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          if-no-files-found: ignore

      - name: Upload traces, videos, screenshots and axe findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: tests/test-results/
          if-no-files-found: ignore

      - name: Upload the stack's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stack-logs
          path: tests/e2e-logs/
          if-no-files-found: ignore

      # Download with `gh run download <run-id> -n visual-baselines -D tests/e2e/__screenshots__`
      # and commit them, so later runs compare against Linux baselines.
      - name: Upload the visual baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/e2e/__screenshots__/
          if-no-files-found: ignore

  # EN-17 (SPM-135). The SLO rules are code, so they are tested like code: promtool (from the
  # prom/prometheus image, which is why this is a CI job) checks the rule files and the Prometheus
  # config, and runs the unit tests that feed synthetic series to every alert and assert it fires, or
  # stays quiet. The dashboards must be valid JSON that queries only metrics that exist, and every
  # alert must have a runbook. Nothing here deploys Prometheus or Grafana.
  observability:
    name: Observability (promtool, dashboards, runbooks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROMETHEUS_IMAGE: prom/prometheus:v2.55.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/p:ro" --entrypoint promtool "$PROMETHEUS_IMAGE"             check rules /p/rules/recording.yml /p/rules/alerts.yml

      - name: promtool check config
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/p:ro" --entrypoint promtool "$PROMETHEUS_IMAGE"             check config --syntax-only /p/prometheus.yml

      - name: promtool test rules (every alert fires and stays quiet)
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/p:ro" -w /p/tests --entrypoint promtool "$PROMETHEUS_IMAGE"             test rules availability.test.yml invariants.test.yml notification_freshness.test.yml             registration_latency.test.yml staff_api_latency.test.yml

      - name: Dashboards are valid JSON on emitted metrics, every alert has a runbook
        run: npx tsx --test documentation/scripts/check-observability.test.ts

  # EN-06.3 (SPM-172). Rules and the reasons for the ones turned off are in
  # .squawk.toml. Only the migrations a pull request adds or changes are linted:
  # merged migrations are never edited (implementation.md §4.8).
  migration-lint:
    name: Migration lint (squawk)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint the migrations this pull request adds or changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t changed < <(git diff --name-only --diff-filter=AMR "$BASE_SHA"...HEAD -- ':(glob)**/migrations/**/*.sql')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No migration changed."
            exit 0
          fi
          printf 'Linting %s\n' "${changed[@]}"
          npx --yes squawk-cli@2.67.0 "${changed[@]}"

  # EN-06.3 (SPM-172). Scans every commit, not only the newest, so a secret
  # committed and then deleted in a later commit is still caught. The binary is
  # a pinned release, checked against its published SHA-256 before it runs.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan the whole history for committed secrets
        # --verbose names the file, line, rule and commit of a finding; --redact still hides the value.
        run: ./gitleaks git . --redact --verbose --no-banner --exit-code 1

  # EN-06.2 (SPM-167). Stryker plants small bugs in the domain code a pull
  # request changes and checks that some unit test fails for each. Below 80% it
  # fails the build. The full run is nightly, in mutation.yml.
  mutation:
    name: Mutation testing (Stryker, changed domain code)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Mutate the domain code this pull request changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          for ws in backend/services/planning-core backend/services/notification backend/services/registration; do
            mapfile -t changed < <(git diff --name-only --diff-filter=AMR "$BASE_SHA"...HEAD -- ":(glob)$ws/src/**/domain/**/*.ts" | sed "s|^$ws/||")
            if [ "${#changed[@]}" -eq 0 ]; then
              echo "$ws: no domain code changed."
              continue
            fi
            echo "$ws: mutating ${changed[*]}"
            (cd "$ws" && npx stryker run --mutate "$(IFS=,; echo "${changed[*]}")")
          done

      - name: Mutation score
        if: always()
        run: node .github/scripts/mutation-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: |
            backend/services/planning-core/reports/mutation/
            backend/services/notification/reports/mutation/
            backend/services/registration/reports/mutation/
          if-no-files-found: ignore

  # EN-22. Builds the story, acceptance criterion, test, last result matrix from the traceability
  # CSVs, the test jobs' JSON reports and the functional cards. It runs even when a test job
  # failed, because a red run is when the matrix matters. Missing tests and names that do not exist
  # are warnings: the job fails only if the generator itself breaks.
  # EN-14's e2e job: add it to `needs` when it lands; its Playwright JSON report is read when the
  # artifact is present (the name starts with playwright-report).
  traceability:
    name: Traceability matrix
    needs: [checks, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Download the test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: results
          merge-multiple: false

      - name: Download the Playwright report, if a job wrote one
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: playwright-report*
          path: results
          merge-multiple: false

      - name: Generate the matrix
        run: |
          npx tsx documentation/scripts/traceability-matrix.ts --results results --out traceability-out --annotate
          npx tsx documentation/scripts/traceability-matrix.ts --results results --summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the matrix
        uses: actions/upload-artifact@v4
        with:
          name: traceability-matrix
          path: traceability-out/

  # EN-05 (SPM-123, ADR-0008). A producer must not silently break a consumer, so
  # a message's data may only change in a backward-compatible way: every message
  # that was valid on the base branch must still be valid. The schemas are the
  # JSON Schema files generated from `contracts`; the checker follows the rules
  # Confluent's and Redpanda's registries use (backend/packages/contracts/
  # src/compat). The registry job below asks a real Redpanda the same question.
  schema-compat:
    name: Message schema compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: The committed schema files are what contracts generates
        run: npm run schemas:check

      - name: Compare with the pull request's base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run schemas:compat -- --base "$BASE_SHA"

  # EN-05 (EN-05-T9). The Debezium Server component renders into valid Kubernetes
  # objects and is hardened and sized. It proves the manifests are well formed, not
  # that they run on the Oracle node or reach Supabase.
  cdc-manifests:
    name: CDC component manifests (kustomize, kubeconform)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.7.0
      KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSfL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum --check
          tar -xzf kubeconform.tar.gz kubeconform

      - name: Render the component and validate it (strict, so an unknown field fails)
        run: |
          kubectl kustomize deploy/k8s/test/cdc > rendered-cdc.yaml
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 rendered-cdc.yaml

      - name: Check the rendered component (one replica, Recreate, hardened, no literal credentials)
        run: python3 deploy/ci/check-cdc-rendered.py rendered-cdc.yaml

  # EN-05 (EN-05-T7, EN-05-T8). Containers are allowed in CI only (ADR-0012), and
  # these three live as long as this job and are thrown away with the runner:
  # a Postgres with logical decoding, Redpanda (the registry and Kafka the
  # staging cluster runs) and Debezium Server. Never the team's Supabase project.
  #   1. Redpanda's Schema Registry is asked what the backward-compatibility
  #      checker answers, for a table of cases and for this branch against its base.
  #   2. Debezium Server, with the component's own application.properties and a
  #      hardened container like the pod, must publish what the polling relay
  #      would, for every message type.
  cdc-and-registry:
    name: Schema registry and CDC (Redpanda, Debezium Server)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REDPANDA_IMAGE: docker.redpanda.com/redpandadata/redpanda:v26.2.6
      POSTGRES_IMAGE: postgres:17
      DEBEZIUM_IMAGE: quay.io/debezium/server:3.7.0.Final
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/connectsphere_ci
      KAFKA_BROKERS: 127.0.0.1:9092
      SCHEMA_REGISTRY_URL: http://127.0.0.1:8081
    steps:
      - name: Refuse any database but the runner's own
        run: |
          case "$DATABASE_URL" in
            postgres://*@127.0.0.1:5432/*) echo "DATABASE_URL is the runner's throwaway Postgres." ;;
            *) echo "::error::DATABASE_URL must point at the runner's own Postgres, never a shared database (EN-06)"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Start a throwaway Postgres with logical decoding
        run: |
          docker run -d --name postgres --network host \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=connectsphere_ci \
            "$POSTGRES_IMAGE" -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4
          for i in $(seq 1 60); do
            docker exec postgres pg_isready -h 127.0.0.1 -U ci -d connectsphere_ci && exit 0
            sleep 1
          done
          docker logs postgres
          exit 1

      - name: Start a throwaway Redpanda (Kafka and Schema Registry)
        run: |
          docker run -d --name redpanda --network host "$REDPANDA_IMAGE" \
            redpanda start --mode dev-container --smp 1 --memory 1G --reserve-memory 0M \
            --overprovisioned --node-id 0 --check=false \
            --kafka-addr PLAINTEXT://127.0.0.1:9092 --advertise-kafka-addr PLAINTEXT://127.0.0.1:9092 \
            --rpc-addr 127.0.0.1:33145 --advertise-rpc-addr 127.0.0.1:33145 \
            --schema-registry-addr 127.0.0.1:8081 \
            --pandaproxy-addr 127.0.0.1:8082 --advertise-pandaproxy-addr 127.0.0.1:8082
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8081/subjects && echo && exit 0
            sleep 2
          done
          docker logs redpanda
          exit 1

      - name: Ask Redpanda's registry about every case and about this branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: npx tsx backend/scripts/schema-registry-check.ts

      # While the base branch has no schema files, the line above has nothing to
      # compare. This runs the same mechanics against the checked-out commit itself,
      # so register and compare are exercised on the real files either way.
      - name: Register this commit's schemas and compare them with themselves
        env:
          BASE_REF: HEAD
        run: npx tsx backend/scripts/schema-registry-check.ts branch

      - name: Build the database from the migrations
        run: npm run migrate:all

      - name: Start Debezium Server (the component's configuration, a hardened container)
        run: |
          mkdir -p "$RUNNER_TEMP/debezium-data"
          chmod 777 "$RUNNER_TEMP/debezium-data"
          docker run -d --name debezium --network host \
            --user 185:185 --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -v "$GITHUB_WORKSPACE/deploy/k8s/components/cdc/application.properties:/debezium/config/application.properties:ro" \
            -v "$RUNNER_TEMP/debezium-data:/debezium/data" \
            -e CDC_DB_HOST=127.0.0.1 -e CDC_DB_USER=ci -e CDC_DB_PASSWORD=ci \
            -e CDC_DB_NAME=connectsphere_ci -e CDC_DB_SSLMODE=disable \
            -e KAFKA_BROKERS=127.0.0.1:9092 -e KAFKA_SECURITY_PROTOCOL=PLAINTEXT \
            -e ENABLE_DEBEZIUM_SCRIPTING=true -e JAVA_OPTS_APPEND=-Xmx384m \
            "$DEBEZIUM_IMAGE"
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8089/q/health/live && echo && exit 0
            if [ -z "$(docker ps -q --filter name=debezium)" ]; then echo "::error::Debezium Server exited"; break; fi
            sleep 2
          done
          docker logs debezium
          exit 1

      - name: Debezium Server must publish what the relay publishes, for every message type
        run: npx tsx backend/scripts/cdc-parity-check.ts

      - name: Container logs
        if: always()
        run: |
          echo "::group::debezium"; docker logs --tail 120 debezium || true; echo "::endgroup::"
          echo "::group::redpanda"; docker logs --tail 40 redpanda || true; echo "::endgroup::"
          echo "::group::postgres"; docker logs --tail 40 postgres || true; echo "::endgroup::"
