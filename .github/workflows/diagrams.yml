# C4 diagrams (EN-09, SPM-127). Validates documentation/c4/connectsphere.dsl
# and renders every view to PNG and SVG. Runs in CI because the Structurizr
# CLI needs Java 17+; containers are allowed in CI (ADR-0012), never locally.
#
# The rendered images are uploaded as the "c4-diagrams" artifact. When the
# model changes, download that artifact and commit the images into
# documentation/c4/images/ (documentation/c4/README.md has the commands).
name: Diagrams

on:
  pull_request:
    paths:
      - "documentation/c4/**"
      - ".github/workflows/diagrams.yml"
  push:
    branches: [main]
    paths:
      - "documentation/c4/**"
      - ".github/workflows/diagrams.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Validate and render the C4 model
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate the model
        run: >
          docker run --rm -v "$PWD/documentation/c4:/usr/local/structurizr"
          structurizr/cli validate -workspace connectsphere.dsl

      - name: Export every view to PlantUML
        run: >
          docker run --rm -v "$PWD/documentation/c4:/usr/local/structurizr"
          structurizr/cli export -workspace connectsphere.dsl -format plantuml/structurizr -output build

      - name: Render PNG and SVG
        run: |
          docker run --rm -v "$PWD/documentation/c4/build:/data" plantuml/plantuml -tpng "/data/*.puml"
          docker run --rm -v "$PWD/documentation/c4/build:/data" plantuml/plantuml -tsvg "/data/*.puml"
          ls -l documentation/c4/build

      - uses: actions/upload-artifact@v4
        with:
          name: c4-diagrams
          path: |
            documentation/c4/build/*.png
            documentation/c4/build/*.svg
          if-no-files-found: error
