# CodeQL code scanning for JavaScript and TypeScript (EN-06.3, SPM-172).
# Results appear in the repository's Security tab, under Code scanning.
#
# This is CodeQL's "advanced setup": a workflow in the repo, which needs no
# admin rights. If a repo admin ever turns on the "default setup" in Settings,
# delete this file, because GitHub refuses results from both at once.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 03:23 UTC, so new CodeQL queries also run against unchanged code.
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (JavaScript and TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
