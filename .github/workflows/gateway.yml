# EN-12 (SPM-130): the API gateway, its rate limits and the CDN (ADR-0011).
#
# Its own workflow, like Deploy (#75), so none of it is a required check on ci.yml.
#
#   files        node tests of kong.yml, the rendering step and the CDN files (also run by ci.yml's `npm run test:unit`)
#   kong-config  `kong config parse` of the committed file and of a rendered one (needs Docker: CI only, ADR-0012)
#   integration  a throwaway Postgres and Redis, the fake JWKS server, the three services and TWO Kong
#                containers sharing the Redis, driven by gateway/tests/integration/gateway.int.mjs
#   cdn          terraform fmt, validate for the CloudFront configuration. NOTHING IS APPLIED: no CDN is deployed.
#   manifests    kustomize and kubeconform for gateway/k8s. NOTHING IS APPLIED: there is no cluster.
#
# CI never touches the team's shared Supabase project or database: the integration job refuses any
# DATABASE_URL but the runner's own, and the fake JWKS server refuses to start beside any other.
name: Gateway

on:
  pull_request:
    paths:
      - "gateway/**"
      - "backend/services/registration/**"
      - ".github/workflows/gateway.yml"
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "backend/services/registration/**"
      - ".github/workflows/gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: true

env:
  KONG_IMAGE: kong:3.9

jobs:
  files:
    name: Gateway files (kong.yml, rendering, CDN)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Node tests
        run: npm run test:gateway

  kong-config:
    name: Kong configuration (kong config parse)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: kong config parse (committed gateway/kong.yml)
        run: |
          docker run --rm \
            -e KONG_DATABASE=off -e KONG_UNTRUSTED_LUA=on \
            -v "$PWD/gateway:/gateway:ro" \
            "$KONG_IMAGE" kong config parse /gateway/kong.yml

      - name: kong config parse (rendered, with a JWKS key, the CI echo and low limits)
        run: |
          mkdir -p "$RUNNER_TEMP/rendered"
          node gateway/ci/throwaway-jwks.mjs "$RUNNER_TEMP/rendered/jwks.json"
          node gateway/scripts/render-config.mjs \
            --jwks-file "$RUNNER_TEMP/rendered/jwks.json" \
            --redis 127.0.0.1:6379 --planning-core 127.0.0.1:8090 --notification 127.0.0.1:8091 --registration 127.0.0.1:8092 \
            --staff-limit 15 --public-limit 20 --with-ci-echo \
            --out "$RUNNER_TEMP/rendered/kong.yml"
          chmod 644 "$RUNNER_TEMP/rendered/kong.yml"
          docker run --rm \
            -e KONG_DATABASE=off -e KONG_UNTRUSTED_LUA=on \
            -v "$RUNNER_TEMP/rendered:/rendered:ro" \
            "$KONG_IMAGE" kong config parse /rendered/kong.yml

  integration:
    name: Gateway integration (Kong x2, Redis, services)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: connectsphere_gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d connectsphere_gateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The runner's own database: throwaway credentials for a container nobody else can reach.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/connectsphere_gateway
      SUPABASE_URL: http://127.0.0.1:9999
      SUPABASE_ANON_KEY: ci-gateway-anon-key
      SUPABASE_JWKS_URL: http://127.0.0.1:9999/auth/v1/.well-known/jwks.json
      SUPABASE_SERVICE_ROLE_KEY: ""
      PLANNING_CORE_PORT: "8090"
      NOTIFICATION_PORT: "8091"
      REGISTRATION_PORT: "8092"
      PLANNING_CORE_URL: http://127.0.0.1:8090
      KAFKA_BROKERS: ""
      KAFKA_SASL_USERNAME: ""
      KAFKA_SASL_PASSWORD: ""
      LOG_LEVEL: warn
      # Throwaway values for a stack that lives as long as this job.
      GATEWAY_CI_FAKE_JWKS: enabled-for-the-gateway-ci-job
      WAITING_ROOM_SIGNING_KEY: gateway-ci-throwaway-signing-key-not-a-secret
      STAFF_LIMIT: "15"
      PUBLIC_LIMIT: "20"
    steps:
      - name: Refuse any database but the runner's own
        run: |
          case "$DATABASE_URL" in
            postgres://*@127.0.0.1:5432/*|postgres://*@localhost:5432/*) echo "DATABASE_URL is the runner's throwaway Postgres." ;;
            *) echo "::error::DATABASE_URL must point at the runner's own Postgres, never a shared database (EN-06)"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the database from the migrations (every module and service, with seeds)
        run: |
          mkdir -p gateway-logs
          npm run migrate:all

      - name: Start the fake JWKS server and the CI echo upstream
        run: |
          setsid nohup node gateway/ci/fake-jwks.mjs > gateway-logs/fake-jwks.log 2>&1 &
          setsid nohup node gateway/ci/echo-upstream.mjs > gateway-logs/echo.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:9999/auth/v1/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:9999/auth/v1/.well-known/jwks.json

      - name: Start planning-core, notification and the registration service
        run: |
          for service in planning-core notification registration; do
            (cd "backend/services/$service" && setsid nohup npx tsx src/index.ts > "$GITHUB_WORKSPACE/gateway-logs/$service.log" 2>&1 &)
          done
          for port in 8090 8091 8092; do
            ok=0
            for i in $(seq 1 90); do
              if curl -fs "http://127.0.0.1:$port/readyz" > /dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then echo "::error::nothing ready on port $port"; tail -n 40 gateway-logs/*.log; exit 1; fi
          done

      - name: Render the Kong configuration from the fake JWKS
        run: |
          mkdir -p gateway-ci
          node gateway/scripts/render-config.mjs \
            --jwks-url "$SUPABASE_JWKS_URL" \
            --redis 127.0.0.1:6379 --planning-core 127.0.0.1:8090 --notification 127.0.0.1:8091 --registration 127.0.0.1:8092 \
            --staff-limit "$STAFF_LIMIT" --public-limit "$PUBLIC_LIMIT" --with-ci-echo \
            --out gateway-ci/kong.yml
          chmod 644 gateway-ci/kong.yml

      - name: Start two Kong instances that share the Redis
        run: |
          start_kong() { # <name> <proxy port> <status port>
            docker run -d --name "$1" --network host \
              -e KONG_DATABASE=off \
              -e KONG_DECLARATIVE_CONFIG=/kong/kong.yml \
              -e KONG_PROXY_LISTEN="127.0.0.1:$2" \
              -e KONG_ADMIN_LISTEN=off \
              -e KONG_STATUS_LISTEN="127.0.0.1:$3" \
              -e KONG_UNTRUSTED_LUA=on \
              -e KONG_NGINX_WORKER_PROCESSES=1 \
              -e KONG_PROXY_ACCESS_LOG=/dev/stdout \
              -e KONG_PROXY_ERROR_LOG=/dev/stderr \
              -e KONG_LOG_LEVEL=notice \
              -v "$PWD/gateway-ci/kong.yml:/kong/kong.yml:ro" \
              "$KONG_IMAGE"
          }
          start_kong kong-a 8000 8201
          start_kong kong-b 8100 8202
          for port in 8201 8202; do
            ok=0
            for i in $(seq 1 60); do
              if curl -fs "http://127.0.0.1:$port/status/ready" > /dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then echo "::error::Kong on status port $port never became ready"; docker logs kong-a; docker logs kong-b; exit 1; fi
          done

      - name: Gateway integration tests
        run: node --test --test-reporter=spec gateway/tests/integration/gateway.int.mjs

      - name: Collect the logs
        if: always()
        run: |
          docker logs kong-a > gateway-logs/kong-a.log 2>&1 || true
          docker logs kong-b > gateway-logs/kong-b.log 2>&1 || true
          cp gateway-ci/kong.yml gateway-logs/rendered-kong.yml 2>/dev/null || true

      - name: Print the Kong and service logs after a failure
        if: failure()
        run: |
          for f in kong-a kong-b planning-core registration notification; do
            echo "::group::$f"; tail -n 60 "gateway-logs/$f.log" || true; echo "::endgroup::"
          done

      - name: Upload the logs and the rendered configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-logs
          path: gateway-logs/
          if-no-files-found: ignore

  cdn:
    name: CDN configuration (terraform fmt and validate, nothing applied)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gateway/cdn/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

      - name: terraform init -backend=false
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

  manifests:
    name: Kubernetes manifests (kustomize and kubeconform, nothing applied)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.7.0
      KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install kubeconform
        run: |
          curl -sSfL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum --check
          tar -xzf kubeconform.tar.gz kubeconform

      - name: Validate the manifests (kustomize, then kubeconform in strict mode)
        run: |
          set -euo pipefail
          kubectl kustomize --load-restrictor LoadRestrictionsNone gateway/k8s > rendered-gateway.yaml
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 rendered-gateway.yaml

      - name: Check the rendered manifests (hardened, DB-less, no Admin API, no Secret)
        run: node gateway/ci/check-manifests.mjs rendered-gateway.yaml
