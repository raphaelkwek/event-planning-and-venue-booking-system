# EN-10 and EN-16 (ADR-0012): container images, Kubernetes manifests, Terraform,
# GitOps and canary releases.
#
# This is its own workflow so that none of it is a required check on
# ci.yml. `images` runs on every pull request and push to main; the jobs that
# need a cluster (kind) run only when deploy/, a Dockerfile or this file
# changes, and on main.
name: Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the slower cluster jobs are worth running.
  changes:
    name: Which deploy jobs apply
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Push to main: every deploy job runs."
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(deploy/|\.dockerignore|\.github/workflows/deploy\.yml|backend/scripts/(migrate\.ts|Dockerfile)|backend/services/[^/]+/Dockerfile|frontend/(Dockerfile|nginx\.conf|security-headers\.inc))'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Nothing under deploy/ or any Dockerfile changed: the cluster jobs are skipped."
          fi

  # Builds every image with buildx and the GitHub Actions cache, starts it under
  # the restrictions the manifests impose, and checks its health endpoint
  # (deploy/ci/smoke-image.sh). On main it also pushes the image to GHCR, tagged
  # with the commit sha.
  images:
    name: Image (${{ matrix.name }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: planning-core, file: backend/services/planning-core/Dockerfile }
          - { name: registration, file: backend/services/registration/Dockerfile }
          - { name: notification, file: backend/services/notification/Dockerfile }
          - { name: web, file: frontend/Dockerfile }
          - { name: migrate, file: backend/scripts/Dockerfile }
    # A throwaway database for the smoke checks, as in ci.yml. It lives as long
    # as this job; CLAUDE.md allows containers in CI only.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: connectsphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d connectsphere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      IMAGE: connectsphere-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: false

      - name: Smoke check (starts under the manifests' restrictions, answers its health endpoint)
        run: bash deploy/ci/smoke-image.sh "${{ matrix.name }}" "${IMAGE}:ci"

      - name: Save the image for the cluster jobs
        if: needs.changes.outputs.deploy == 'true'
        run: docker save "${IMAGE}:ci" | gzip > "image-${{ matrix.name }}.tar.gz"

      - name: Upload the image
        if: needs.changes.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: image-${{ matrix.name }}.tar.gz
          retention-days: 1

      # Only main publishes. A pull request never pushes, and a fork's token
      # cannot write packages anyway.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR, tagged with the commit sha
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          provenance: false
