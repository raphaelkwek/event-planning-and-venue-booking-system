# EN-10 and EN-16 (ADR-0012): container images, Kubernetes manifests, Terraform,
# GitOps and canary releases; ADR-0016: the k3s overlays, the arm64 builds and the deploy
# scripts the Release workflow (release.yml) uses.
#
# Nothing here pushes an image. Since ADR-0016 the Release workflow builds, pushes and signs
# the images on main, once, for both architectures; this workflow proves on every pull request
# that they build, start hardened and deploy.
#
# This is its own workflow so that none of it is a required check on
# ci.yml. `images` runs on every pull request and push to main; the jobs that
# need a cluster (kind) run only when deploy/, a Dockerfile or this file
# changes, and on main.
name: Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # A run on main is never cancelled by a newer push: it could stop between the push to GHCR and the
  # signing step and leave an unsigned image behind (EN-21).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides whether the slower cluster jobs are worth running.
  changes:
    name: Which deploy jobs apply
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Push to main: every deploy job runs."
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(deploy/|policies/|vercel\.json|\.dockerignore|\.github/workflows/(deploy|release|deploy-environment)\.yml|backend/scripts/(migrate\.ts|Dockerfile)|backend/services/[^/]+/Dockerfile|frontend/(Dockerfile|nginx\.conf|security-headers\.inc))'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Nothing under deploy/ or any Dockerfile changed: the cluster jobs are skipped."
          fi

  # Builds every image with buildx and the GitHub Actions cache, starts it under
  # the restrictions the manifests impose, and checks its health endpoint
  # (deploy/ci/smoke-image.sh). It pushes nothing: release.yml publishes on main.
  images:
    name: Image (${{ matrix.name }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: planning-core, file: backend/services/planning-core/Dockerfile }
          - { name: registration, file: backend/services/registration/Dockerfile }
          - { name: notification, file: backend/services/notification/Dockerfile }
          - { name: web, file: frontend/Dockerfile }
          - { name: migrate, file: backend/scripts/Dockerfile }
          - { name: cerbos, file: deploy/cerbos/Dockerfile }
    # A throwaway database for the smoke checks, as in ci.yml. It lives as long
    # as this job; CLAUDE.md allows containers in CI only.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: connectsphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d connectsphere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      IMAGE: connectsphere-${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          # Public values the browser needs to sign in (Actions variables, not secrets).
          # Only the web Dockerfile declares them; the others ignore them.
          build-args: |
            SUPABASE_URL=${{ vars.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: false

      - name: Smoke check (starts under the manifests' restrictions, answers its health endpoint)
        run: bash deploy/ci/smoke-image.sh "${{ matrix.name }}" "${IMAGE}:ci"

      - name: Save the image for the cluster jobs
        if: needs.changes.outputs.deploy == 'true'
        run: docker save "${IMAGE}:ci" | gzip > "image-${{ matrix.name }}.tar.gz"

      - name: Upload the image
        if: needs.changes.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.name }}
          path: image-${{ matrix.name }}.tar.gz
          retention-days: 1

      # ADR-0016: the Release workflow (release.yml) builds, pushes and signs the images on main,
      # for linux/amd64 and linux/arm64, through EN-21's sign-and-attest action. This job only
      # proves on a pull request that each image builds and starts.

  # ADR-0016: the Oracle Ampere VM is arm64, so every image the Release workflow ships is also
  # built and smoke-tested natively on an arm64 runner (free for public repositories), the same
  # way the amd64 job does. Runs when deploy/, a Dockerfile or the workflows change.
  images-arm64:
    name: Image arm64 (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: planning-core, file: backend/services/planning-core/Dockerfile }
          - { name: registration, file: backend/services/registration/Dockerfile }
          - { name: notification, file: backend/services/notification/Dockerfile }
          - { name: migrate, file: backend/scripts/Dockerfile }
          - { name: cerbos, file: deploy/cerbos/Dockerfile }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: connectsphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d connectsphere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      IMAGE: connectsphere-${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build (linux/arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha,scope=release-${{ matrix.name }}-arm64
          provenance: false

      - name: Smoke check on arm64
        run: |
          [ "$(docker image inspect "${IMAGE}:ci" --format '{{.Architecture}}')" = arm64 ]
          bash deploy/ci/smoke-image.sh "${{ matrix.name }}" "${IMAGE}:ci"

  # The manifests render and are valid Kubernetes, including the Argo Rollouts, Argo CD
  # and External Secrets custom resources (their schemas come from the Datree CRDs
  # catalog). kubeconform runs in strict mode: an unknown field fails.
  manifests:
    name: Manifests (kustomize and kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.7.0
      KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install kubeconform
        run: |
          curl -sSfL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum --check
          tar -xzf kubeconform.tar.gz kubeconform

      - name: Validate every overlay, the Argo CD manifests and the optional ExternalSecret
        run: |
          set -euo pipefail
          conform() {
            ./kubeconform -strict -summary -kubernetes-version 1.33.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "$@"
          }
          for dir in base overlays/staging overlays/production test/kind-staging test/canary-demo overlays/k3s-staging overlays/k3s-production; do
            out="rendered-$(echo "$dir" | tr / -).yaml"
            echo "::group::deploy/k8s/$dir"
            kubectl kustomize "deploy/k8s/$dir" > "$out"
            conform "$out"
            echo "::endgroup::"
          done
          echo "::group::deploy/argocd, deploy/k8s/optional and the test dependencies"
          conform deploy/argocd deploy/k8s/optional deploy/k8s/test/deps deploy/k8s/test/canary-demo/prometheus.yaml
          echo "::endgroup::"
          echo "::group::deploy/oracle: the deployer RBAC bootstrap.sh applies, per environment"
          for env in staging production; do
            sed "s/ENVIRONMENT/${env}/g" deploy/oracle/deployer-rbac.yaml > "rendered-deployer-${env}.yaml"
            conform "rendered-deployer-${env}.yaml"
          done
          echo "::endgroup::"

      - name: Check the rendered overlays (no Secret, every container hardened and sized)
        run: |
          python3 deploy/ci/check-rendered.py rendered-overlays-staging.yaml rendered-overlays-production.yaml
          # ADR-0016: the k3s overlays run plain Deployments (no canary until EN-17's Prometheus).
          python3 deploy/ci/check-rendered.py --no-canary rendered-overlays-k3s-staging.yaml rendered-overlays-k3s-production.yaml

      - name: Staging and production (k3s) differ only in namespace, hostnames and Secret names
        run: python3 deploy/ci/check-parity.py rendered-overlays-k3s-staging.yaml rendered-overlays-k3s-production.yaml

  terraform:
    name: Terraform (fmt, validate, tflint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.53.0

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

      - name: terraform init -backend=false and validate (each environment)
        run: |
          set -euo pipefail
          for env in staging production; do
            echo "::group::$env"
            (cd "environments/$env" && terraform init -backend=false -input=false && terraform validate)
            echo "::endgroup::"
          done

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"

  # Cluster jobs. Each builds its own kind cluster so they run in parallel, and loads
  # the images the images job built and smoke-tested.
  kind-deploy:
    name: kind smoke deploy (staging overlay)
    needs: [changes, images]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*
          merge-multiple: true
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.29.0
          node_image: kindest/node:v1.33.1
          cluster_name: connectsphere
      - name: Load the images
        run: |
          source deploy/ci/lib.sh
          load_images connectsphere planning-core registration notification web migrate
      - name: Deploy the staging overlay and check every service
        run: bash deploy/ci/kind-deploy.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evidence-kind-deploy
          path: kind-deploy-evidence.md
          if-no-files-found: ignore

  argocd-sync:
    name: Argo CD syncs the staging overlay (kind)
    needs: [changes, images]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*
          merge-multiple: true
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.29.0
          node_image: kindest/node:v1.33.1
          cluster_name: connectsphere
      - name: Load the images
        run: |
          source deploy/ci/lib.sh
          load_images connectsphere planning-core registration notification web migrate
      - name: Install Argo CD and watch it sync deploy/k8s/overlays/staging
        env:
          # A pull request's own commit, which Argo CD can fetch from the public repository;
          # github.sha on a pull request is a merge commit that exists only on the runner.
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash deploy/ci/argocd-sync.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evidence-argocd-sync
          path: |
            argocd-sync-evidence.md
            applied-application.yaml
          if-no-files-found: ignore

  canary-rollback:
    name: Canary promotes a good release and rolls back a bad one (kind)
    needs: [changes]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.29.0
          node_image: kindest/node:v1.33.1
          cluster_name: connectsphere
      - name: Build the stand-in service and load it
        run: |
          docker build -t connectsphere-demo-app:ci deploy/k8s/test/canary-demo/app
          kind load docker-image connectsphere-demo-app:ci --name connectsphere
      - name: Run the canary demonstration
        run: bash deploy/ci/canary-demo.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evidence-canary-rollback
          path: canary-demo-evidence.md
          if-no-files-found: ignore

  # ADR-0016: the k3s staging overlay on kind with its own Redpanda, Temporal and Cerbos, deployed
  # through the deploy gate and the deploy state the Release workflow uses (deploy/ci/kind-k3s.sh).
  kind-k3s:
    name: "kind: k3s staging overlay (Redpanda, Temporal, Cerbos, Traefik)"
    needs: [changes, images]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*
          merge-multiple: true
      # Redpanda's asynchronous I/O wants more than the runner's default.
      - name: Raise fs.aio-max-nr for Redpanda
        run: sudo sysctl -w fs.aio-max-nr=1048576
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.29.0
          node_image: kindest/node:v1.33.1
          cluster_name: connectsphere
      - name: Load the images
        run: |
          source deploy/ci/lib.sh
          load_images connectsphere planning-core registration notification migrate cerbos
      - name: Deploy the k3s staging overlay and smoke-test it
        env:
          # The pull request's own commit, which kustomize fetches from GitHub as the remote base.
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash deploy/ci/kind-k3s.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evidence-kind-k3s
          path: kind-k3s-evidence.md
          if-no-files-found: ignore

  # ADR-0016: the release workflows and deploy scripts are linted on every pull request.
  lint-release:
    name: Release workflows and scripts (actionlint, shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: actionlint
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color .github/workflows/release.yml .github/workflows/deploy-environment.yml .github/workflows/deploy-vm-environment.yml .github/workflows/deploy.yml .github/workflows/keep-awake.yml
      - name: shellcheck
        run: |
          shellcheck --version | head -2
          shellcheck -x deploy/oracle/bootstrap.sh deploy/oracle/connectsphere-deploy deploy/oracle/make-deployer-kubeconfig.sh \
            deploy/release/smoke-api.sh deploy/release/smoke-web.sh deploy/ci/kind-k3s.sh deploy/ci/smoke-image.sh \
            deploy/ci/space-smoke.sh deploy/space/start.sh deploy/space/sweeps.sh deploy/azure/create-vm.sh \
            deploy/azure/connectsphere-vm-deploy deploy/azure/setup-deploy-user.sh

  # ADR-0016 amendment: the Hugging Face Space image. Built from exactly the Space repository that
  # deploy-space.mjs pushes, then run the way a Space runs it, against the job's throwaway Postgres.
  space-image:
    name: "Space image, ${{ matrix.arch }} (one container: services, Redpanda, Temporal, Cerbos, Caddy on 7860)"
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ${{ matrix.runner }}
    # amd64 for a Space or any x86 host; arm64 for the Azure Ampere VM, which builds it natively.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: connectsphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d connectsphere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Write the Space repository (as deploy:space does)
        run: node deploy/space/deploy-space.mjs --context-only "$RUNNER_TEMP/space"
      - name: Build the Space image
        run: docker build -t connectsphere-space:ci "$RUNNER_TEMP/space"
      - name: Run it as a Space and smoke-test it
        run: bash deploy/ci/space-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evidence-space-image-${{ matrix.arch }}
          path: space-evidence.md
          if-no-files-found: ignore
