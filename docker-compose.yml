services:
  identity-service:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    env_file:
      - .env
    ports:
      - "8081:8081"
    # DATABASE_URL / SUPABASE_URL in .env must use host.docker.internal
    # instead of 127.0.0.1 when this container talks to `supabase start`
    # running on the host.

  event-service:
    build:
      context: .
      dockerfile: services/event/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 8082
      EVENT_PORT: 8082
      SERVICE_NAME: event-service
      # The Event Service resolves the caller's role and access scope from
      # Identity on every request (plan.md §5), so it needs to reach it.
      IDENTITY_BASE_URL: http://identity-service:8081
    ports:
      - "8082:8082"
    depends_on:
      - identity-service

# Add your own service here as it's built — one block per service, same shape.
